<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--pwa-start-->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14171c">
<!--pwa-end-->
<title>دفتر الجيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — body map as the home screen, drill down muscle → exercise, fixed bottom nav. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #e3e7ec;
  --fg: #161a20;
  --muted: #5d6673;
  --line: #d3d9e0;
  --accent: #1d5bbf;          /* 20 kg plate blue */
  --accent-fg: #ffffff;
  --skin: #d9dee5;
  --m-base: #b9c2cd;
  --m-hover: #8f9bab;
  --fresh: #d23a2e;           /* trained < 24h */
  --recover: #e6a817;         /* 24–72h */
  --ready: #2f9a4f;           /* 3–7 days */
  --plate-25: #d23a2e; --plate-20: #1d5bbf; --plate-15: #e6b417; --plate-10: #2f9a4f;
  --plate-5: #f4f6f8; --plate-2: #22262c; --plate-1: #a9b1bb;
  --font-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --surface: #1b1f26; --surface-2: #252a33; --fg: #eef1f5; --muted: #98a2b0;
    --line: #2e343e; --accent: #5b9cff; --accent-fg: #0b1220; --skin: #2a3039; --m-base: #444d5a;
    --m-hover: #5f6a7a; --fresh: #f0594b; --recover: #f2bb3a; --ready: #4cc06f;
    --plate-5: #e9edf1; --plate-2: #0d0f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --surface: #1b1f26; --surface-2: #252a33; --fg: #eef1f5; --muted: #98a2b0;
  --line: #2e343e; --accent: #5b9cff; --accent-fg: #0b1220; --skin: #2a3039; --m-base: #444d5a;
  --m-hover: #5f6a7a; --fresh: #f0594b; --recover: #f2bb3a; --ready: #4cc06f;
  --plate-5: #e9edf1; --plate-2: #0d0f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.6 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 150px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.label { font-size: .75rem; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.back { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }
.topbar .titles { min-width: 0; }
.topbar .titles p { margin: 0; font-size: .85rem; }

/* week stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.stat span { font-size: .78rem; color: var(--muted); }

/* segmented */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 6px 18px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* body map */
.map-wrap { display: grid; place-items: center; }
.bodymap { width: 100%; max-width: 300px; height: auto; max-height: 58vh; touch-action: manipulation; }
.bodymap .skin { fill: var(--skin); }
.bodymap .m { fill: var(--m-base); stroke: var(--bg); stroke-width: 1.2; cursor: pointer; transition: fill .15s; }
.bodymap .m:hover { fill: var(--m-hover); }
.bodymap .m.fresh { fill: var(--fresh); }
.bodymap .m.recover { fill: var(--recover); }
.bodymap .m.ready { fill: var(--ready); }
.bodymap .deco { fill: none; stroke: var(--bg); stroke-width: 1.2; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: .8rem; color: var(--muted); }
.legend i, .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--m-base); vertical-align: middle; margin-inline-end: 5px; flex: none; }
.dot.fresh, .legend .fresh { background: var(--fresh); }
.dot.recover, .legend .recover { background: var(--recover); }
.dot.ready, .legend .ready { background: var(--ready); }

/* lists */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 0; background: transparent; text-align: start; width: 100%; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { display: block; font-weight: 600; }
.item .grow small { color: var(--muted); font-size: .82rem; }
.item .chev { color: var(--muted); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.fresh { background: color-mix(in srgb, var(--fresh) 18%, transparent); color: var(--fresh); }
.pill.recover { background: color-mix(in srgb, var(--recover) 22%, transparent); color: color-mix(in srgb, var(--recover) 70%, var(--fg)); }
.pill.ready { background: color-mix(in srgb, var(--ready) 18%, transparent); color: var(--ready); }
.pill.pr { background: color-mix(in srgb, var(--plate-15) 25%, transparent); color: color-mix(in srgb, var(--plate-15) 55%, var(--fg)); }

/* buttons & inputs */
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); font-family: var(--font-display); font-size: 1.05rem; padding: 15px 18px; width: 100%; }
.btn.danger { background: color-mix(in srgb, var(--fresh) 15%, transparent); color: var(--fresh); }
.btn.armed { background: var(--fresh); color: #fff; }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
textarea.input { min-height: 110px; direction: ltr; font-family: ui-monospace, monospace; font-size: .8rem; }

.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { display: flex; flex-direction: column; gap: 6px; }
.stepper .ctl { display: flex; align-items: stretch; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; direction: ltr; }
.stepper button { border: 0; background: transparent; width: 44px; font-size: 1.4rem; line-height: 1; color: var(--accent); flex: none; }
.stepper button:active { background: var(--surface-2); }
.stepper input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; text-align: center; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; padding: 8px 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.suggest { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.suggest .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }

.plates { direction: ltr; display: flex; align-items: center; gap: 2px; height: 64px; }
.plates .bar { height: 8px; width: 34px; background: var(--plate-1); border-radius: 2px; }
.plates .collar { height: 22px; width: 8px; background: var(--muted); border-radius: 2px; }
.plates .plate { border-radius: 3px; border: 1px solid rgb(0 0 0 / .18); }
.plates .tail { height: 8px; flex: 1; max-width: 40px; background: var(--plate-1); border-radius: 2px; }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--bg); border-radius: 10px; }
.set .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
.set .v { flex: 1; font-family: var(--font-display); font-weight: 700; }
.set .x { border: 0; background: transparent; color: var(--muted); font-size: 1.2rem; width: 32px; height: 32px; border-radius: 8px; }
.set .x:hover { background: var(--surface-2); color: var(--fresh); }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.kpis b { display: block; font-family: var(--font-display); font-size: 1.15rem; }
.kpis span { font-size: .75rem; color: var(--muted); }

.chart { width: 100%; height: auto; display: block; direction: ltr; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); }
.chart .endlbl { fill: var(--fg); font-weight: 700; font-size: 11px; }

.day h3 { font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: .9rem; }
.ex-line:first-of-type { border-top: 0; }
.ex-line .sets-txt { color: var(--muted); text-align: end; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 4px; }

/* bottom nav + timer */
.nav { position: fixed; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { border: 0; background: transparent; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .75rem; font-weight: 600; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }
.timer { position: fixed; inset-inline: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 9; padding-inline: 16px; }
.timer .in { max-width: 528px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
.timer .t { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; flex: 1; }
.timer .t small { font-family: var(--font-body); font-size: .8rem; font-weight: 500; opacity: .7; margin-inline-start: 8px; }
.timer button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 10px; padding: 6px 10px; font-weight: 600; }
.timer.done .in { background: var(--ready); color: #fff; }
.timer.done button { color: #fff; }

.toast { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline: 16px; margin: 0 auto; max-width: 420px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 12px; z-index: 20; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
.toast span { flex: 1; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; filter: brightness(1.3); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: drop .2s ease-out; }
  @keyframes drop { from { transform: translateY(-10px); opacity: 0; } }
}
</style>
</head>
<body>
<main class="app" id="view" aria-live="polite"></main>

<div class="timer" id="timer" hidden>
  <div class="in">
    <div class="t"><span class="num" id="timer-t">1:30</span><small id="timer-l">راحة</small></div>
    <button type="button" id="timer-minus">−15</button>
    <button type="button" id="timer-plus">+15</button>
    <button type="button" id="timer-stop" aria-label="إيقاف المؤقت">✕</button>
  </div>
</div>

<nav class="nav" aria-label="التنقل">
  <div class="in">
    <button type="button" data-go="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.2"/><path d="M6 8.5h12M12 8.5v6M12 14.5l-3 6.5M12 14.5l3 6.5M6 8.5l-1.5 6M18 8.5l1.5 6"/></svg>
      الجسم
    </button>
    <button type="button" data-go="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      السجل
    </button>
    <button type="button" data-go="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      الإعدادات
    </button>
  </div>
</nav>

<script>
"use strict";

/* ---------- data ---------- */
const MUSCLES = {
  chest_upper: { name: "صدر علوي", group: "الصدر", view: "front" },
  chest_mid:   { name: "صدر وسط", group: "الصدر", view: "front" },
  chest_lower: { name: "صدر سفلي", group: "الصدر", view: "front" },
  delt_front:  { name: "كتف أمامي", group: "الأكتاف", view: "front" },
  delt_side:   { name: "كتف جانبي", group: "الأكتاف", view: "front" },
  delt_rear:   { name: "كتف خلفي", group: "الأكتاف", view: "back" },
  biceps:      { name: "باي (بايسبس)", group: "الذراع", view: "front" },
  triceps:     { name: "تراي (ترايسبس)", group: "الذراع", view: "back" },
  forearms:    { name: "ساعد", group: "الذراع", view: "front" },
  abs:         { name: "بطن", group: "الوسط", view: "front" },
  obliques:    { name: "جوانب البطن", group: "الوسط", view: "front" },
  traps:       { name: "ترابيس", group: "الظهر", view: "back" },
  upper_back:  { name: "ظهر وسط", group: "الظهر", view: "back" },
  lats:        { name: "مجنص (لاتس)", group: "الظهر", view: "back" },
  lower_back:  { name: "ظهر سفلي", group: "الظهر", view: "back" },
  glutes:      { name: "مؤخرة (جلوتس)", group: "الأرجل", view: "back" },
  quads:       { name: "فخذ أمامي", group: "الأرجل", view: "front" },
  hamstrings:  { name: "فخذ خلفي", group: "الأرجل", view: "back" },
  calves:      { name: "سمانة", group: "الأرجل", view: "both" },
};

const TYPES = { barbell: "بار", dumbbell: "دمبل", machine: "جهاز", cable: "كيبل", bodyweight: "وزن الجسم" };

const PRESETS = {
  chest_upper: [["بنش مائل بار", "barbell"], ["بنش مائل دمبل", "dumbbell"], ["تفتيح مائل دمبل", "dumbbell"], ["كيبل كروس من تحت لفوق", "cable"]],
  chest_mid:   [["بنش مستوي بار", "barbell"], ["بنش مستوي دمبل", "dumbbell"], ["جهاز ضغط صدر", "machine"], ["بيك ديك (فراشة)", "machine"]],
  chest_lower: [["بنش مقلوب بار", "barbell"], ["متوازي (ديبس)", "bodyweight"], ["كيبل كروس من فوق لتحت", "cable"]],
  delt_front:  [["ضغط أكتاف بار", "barbell"], ["ضغط أكتاف دمبل", "dumbbell"], ["رفرفة أمامي دمبل", "dumbbell"]],
  delt_side:   [["رفرفة جانبي دمبل", "dumbbell"], ["رفرفة جانبي كيبل", "cable"], ["جهاز رفرفة جانبي", "machine"]],
  delt_rear:   [["رفرفة خلفي دمبل", "dumbbell"], ["جهاز فراشة عكسي", "machine"], ["فيس بول", "cable"]],
  biceps:      [["بايسبس بار", "barbell"], ["بايسبس دمبل", "dumbbell"], ["هامر", "dumbbell"], ["بايسبس كيبل", "cable"]],
  triceps:     [["تراي كيبل حبل", "cable"], ["فرنش برس", "barbell"], ["تراي فوق الراس دمبل", "dumbbell"], ["بنش ضيق", "barbell"]],
  forearms:    [["رسغ بار", "barbell"], ["رسغ عكسي", "barbell"]],
  abs:         [["كرنش", "bodyweight"], ["رفع رجلين معلّق", "bodyweight"], ["كرنش كيبل", "cable"]],
  obliques:    [["روسيان تويست", "bodyweight"], ["ميلان جانبي دمبل", "dumbbell"]],
  traps:       [["شرغ بار", "barbell"], ["شرغ دمبل", "dumbbell"]],
  upper_back:  [["تجديف بار", "barbell"], ["تجديف دمبل", "dumbbell"], ["تجديف كيبل جالس", "cable"]],
  lats:        [["سحب أمامي", "cable"], ["عقلة", "bodyweight"], ["بول أوفر كيبل", "cable"]],
  lower_back:  [["ديدليفت", "barbell"], ["ظهر سفلي (هايبر)", "bodyweight"]],
  glutes:      [["هيب ثرست بار", "barbell"], ["بلغاري سكوات", "dumbbell"], ["جهاز أبداكتور", "machine"]],
  quads:       [["سكوات بار", "barbell"], ["ليج برس", "machine"], ["ليج إكستنشن", "machine"], ["هاك سكوات", "machine"], ["لانجز دمبل", "dumbbell"]],
  hamstrings:  [["ليج كيرل", "machine"], ["رومانيان ديدليفت", "barbell"]],
  calves:      [["سمانة واقف", "machine"], ["سمانة جالس", "machine"]],
};

const STORE_KEY = "gymlog.v1";
let db = { custom: [], sets: [], rest: 90 };

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) db = Object.assign(db, JSON.parse(raw));
  } catch (e) { /* storage unavailable: run in memory */ }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function allExercises() {
  const list = [];
  for (const [m, arr] of Object.entries(PRESETS)) {
    arr.forEach(([name, type], i) => list.push({ id: `${m}-${i}`, name, type, muscle: m, custom: false }));
  }
  return list.concat(db.custom.map(c => ({ ...c, custom: true })));
}
const exById = id => allExercises().find(e => e.id === id);
const exercisesOf = m => allExercises().filter(e => e.muscle === m);

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtW = w => (Math.round(w * 100) / 100).toString();
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const todayKey = () => dayKey(Date.now());
const dayStart = key => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
function daysAgo(key) {
  const n = Math.round((dayStart(todayKey()) - dayStart(key)) / 86400000);
  if (n <= 0) return "اليوم";
  if (n === 1) return "مبارح";
  if (n === 2) return "قبل يومين";
  if (n <= 10) return `قبل ${n} أيام`;
  return `قبل ${n} يوم`;
}
const fmtDate = key => new Date(dayStart(key)).toLocaleDateString("ar-u-nu-latn", { weekday: "long", day: "numeric", month: "long" });
const wr = (w, r) => `<span class="num">${fmtW(w)}</span> كغ × <span class="num">${r}</span>`;
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);

const setsOf = exId => db.sets.filter(s => s.ex === exId).sort((a, b) => a.t - b.t);
function sessionsOf(exId) {
  const map = new Map();
  for (const s of setsOf(exId)) {
    const k = dayKey(s.t);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(s);
  }
  return [...map.entries()].map(([day, sets]) => ({ day, sets }));
}
function bestOf(exId) {
  const sets = setsOf(exId);
  if (!sets.length) return null;
  let maxW = 0, best1 = 0;
  for (const s of sets) { maxW = Math.max(maxW, s.w); best1 = Math.max(best1, e1rm(s.w, s.r)); }
  return { maxW, best1 };
}
function topSet(sets) {
  return sets.reduce((a, s) => (!a || s.w > a.w || (s.w === a.w && s.r > a.r)) ? s : a, null);
}
function muscleLast(m) {
  const ids = new Set(exercisesOf(m).map(e => e.id));
  let t = 0;
  for (const s of db.sets) if (ids.has(s.ex) && s.t > t) t = s.t;
  return t;
}
function status(m) {
  const t = muscleLast(m);
  if (!t) return { cls: "", label: "ما تدربت" };
  const h = (Date.now() - t) / 3600000;
  if (h < 24) return { cls: "fresh", label: "متدربة اليوم" };
  if (h < 72) return { cls: "recover", label: "بتتعافى" };
  if (h < 24 * 7) return { cls: "ready", label: "جاهزة" };
  return { cls: "", label: "صارلها زمان" };
}
function stepFor(type) { return type === "dumbbell" ? 1 : type === "bodyweight" ? 2.5 : 2.5; }

function suggestion(ex) {
  const past = sessionsOf(ex.id).filter(s => s.day !== todayKey());
  if (!past.length) return null;
  const last = past[past.length - 1];
  const top = topSet(last.sets);
  const step = stepFor(ex.type);
  let w = top.w, r = top.r, why;
  if (top.r >= 12) { w = top.w + step; r = 8; why = `وصلت ${top.r} عدّات آخر مرة. وقت تزيد الوزن.`; }
  else if (top.r >= 6) { r = top.r + 1; why = "نفس الوزن، حاول تزيد عدّة وحدة."; }
  else { r = 6; why = "ثبّت على هالوزن لحد ما توصل 6 عدّات نظيفة."; }
  return { last, top, w, r, why };
}

// Shapes are drawn for the figure's right side (x < 100) and mirrored when mirror is true.
const E = (cx, cy, rx, ry, rot = 0) => ({ e: [cx, cy, rx, ry, rot] });
const P = d => ({ d });
const SKIN = [
  [E(100, 38, 17, 21), false], [P("M91 54h18v16H91z"), false],
  [P("M70 72 Q100 64 130 72 L137 100 Q132 140 126 180 L125 200 L75 200 L74 180 Q68 140 63 100 Z"), false],
  [P("M75 196 L125 196 L129 224 L71 224 Z"), false],
  [E(54, 112, 12, 31, 12), true], [E(44, 168, 9.5, 28, 10), true], [E(39, 203, 7, 8), true],
  [E(86, 262, 16, 46, 3), true], [E(88, 344, 11, 36), true], [E(88, 388, 11, 6), true],
];
const FRONT = [
  ["delt_side", E(57, 89, 8, 14, 18), true],
  ["delt_front", E(69, 85, 8.5, 11), true],
  ["chest_upper", P("M99 76 L80 78.5 Q72 83 74 92 L99 92 Z"), true],
  ["chest_mid", P("M99 93.5 L74 93.5 Q72.5 100 76 106 L99 106 Z"), true],
  ["chest_lower", P("M99 107.5 L77 107.5 Q80 116 88 119 L99 118.5 Z"), true],
  ["biceps", E(54, 115, 8, 20, 12), true],
  ["forearms", E(44, 166, 7, 22, 10), true],
  ["obliques", P("M84 124 L76 128 Q73 155 79 180 L84 182 Z"), true],
  ["abs", P("M92 123 h16 a6 6 0 0 1 6 6 v48 a8 8 0 0 1 -8 8 h-12 a8 8 0 0 1 -8 -8 v-48 a6 6 0 0 1 6 -6 Z"), false],
  ["quads", E(86, 258, 13, 38, 3), true],
  ["calves", E(88, 338, 8, 24), true],
];
const FRONT_DECO = ["M86 140h28M86 156h28M86 170h28M100 124v60"];
const BACK = [
  ["traps", P("M100 57 L86 70 L74 77 L100 100 L126 77 L114 70 Z"), false],
  ["delt_rear", E(63, 86, 11, 12), true],
  ["upper_back", P("M99 101.5 L80 83 Q76 94 80 111 L99 118 Z"), true],
  ["lats", P("M78 97 Q67 112 72 138 L88 152 L99 146 L99 120 L80 113 Z"), true],
  ["lower_back", P("M88 155 L112 155 L116 190 L84 190 Z"), false],
  ["triceps", E(54, 112, 9, 21, 12), true],
  ["forearms", E(44, 166, 7, 22, 10), true],
  ["glutes", E(87, 212, 14, 15), true],
  ["hamstrings", E(87, 264, 13, 34, 3), true],
  ["calves", E(88, 334, 10, 24), true],
];
function shapeSVG(s, attrs) {
  if (s.d) return `<path d="${s.d}" ${attrs}/>`;
  const [cx, cy, rx, ry, rot] = s.e;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ""} ${attrs}/>`;
}
const MIRROR = 'transform="translate(200 0) scale(-1 1)"';
function bodySVG(side) {
  const parts = SKIN.map(([s, mir]) => {
    const one = shapeSVG(s, 'class="skin"');
    return mir ? one + `<g ${MIRROR}>${one}</g>` : one;
  });
  const defs = side === "front" ? FRONT : BACK;
  for (const [m, s, mir] of defs) {
    const st = status(m).cls;
    const a = `class="m ${st}" data-m="${m}"`;
    const one = shapeSVG(s, a);
    parts.push(`<g role="button" tabindex="-1" aria-label="${esc(MUSCLES[m].name)}">${one}${mir ? `<g ${MIRROR}>${one}</g>` : ""}</g>`);
  }
  if (side === "front") parts.push(`<path class="deco" d="${FRONT_DECO.join(" ")}"/>`);
  return `<svg class="bodymap" viewBox="0 0 200 400" aria-label="خريطة العضلات">${parts.join("")}</svg>`;
}

function weekStats() {
  const now = new Date();

  const sets = db.sets.filter(s => s.t >= start);
  return {
    days: new Set(sets.map(s => dayKey(s.t))).size,
    sets: sets.length,
    vol: Math.round(sets.reduce((a, s) => a + s.w * s.r, 0)),
  };
}
const fmtVol = v => v >= 10000 ? (v / 1000).toFixed(1) + "k" : v.toLocaleString("en");

function platesHTML(w) {
  const BAR = 20;
  if (w < BAR) return `<p class="muted" style="margin:0">الوزن أقل من وزن البار الأولمبي (20 كغ).</p>`;
  let side = (w - BAR) / 2;
  const sizes = [[25, "--plate-25", 60], [20, "--plate-20", 60], [15, "--plate-15", 52], [10, "--plate-10", 44], [5, "--plate-5", 34], [2.5, "--plate-2", 26], [1.25, "--plate-1", 20]];
  const out = [];
  for (const [kg, color, h] of sizes) {
    while (side >= kg - 1e-9) { side -= kg; out.push({ kg, color, h }); }
  }
  const rest = Math.round(side * 100) / 100;
  const html = out.map(p => `<div class="plate" title="${p.kg} كغ" style="height:${p.h}px;width:${p.kg >= 10 ? 12 : 9}px;background:var(${p.color})"></div>`).join("");
  const label = out.length ? out.map(p => p.kg).join(" + ") : "البار فاضي";
  return `<div class="plates" aria-hidden="true"><div class="bar"></div><div class="collar"></div>${html}<div class="tail"></div></div>
    <p class="muted" style="margin:0;font-size:.85rem">كل جهة: <span class="num">${label}</span>${rest ? ` <span class="num">(+${rest})</span>` : ""}</p>`;
}

function chartSVG(points) {
  if (points.length < 2) return `<p class="muted" style="margin:0">سجّل جلستين على الأقل لتشوف منحنى تطورك.</p>`;
  const W = 340, H = 160, pl = 36, pr = 30, pt = 24, pb = 24;
  const pts = points.slice(-14);
  const ws = pts.map(p => p.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (lo === hi) { lo -= 2.5; hi += 2.5; }
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const ticks = [lo, (lo + hi) / 2, hi];
  const grid = ticks.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${fmtW(Math.round(v * 10) / 10)}</text>`).join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1)} ${H - pb} L${x(0)} ${H - pb} Z`;
  const dots = pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.w)}" r="3"/>`).join("");
  const n = pts.length - 1, last = pts[n];
  const short = k => { const [, m, d] = k.split("-"); return `${+d}/${+m}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى أعلى وزن بكل جلسة">
    ${grid}<path class="area" d="${area}"/><path class="line" d="${line}"/>${dots}
    <circle class="end" cx="${x(n)}" cy="${y(last.w)}" r="4.5"/>
    <text class="endlbl" x="${x(n)}" y="${y(last.w) - 9}" text-anchor="middle">${fmtW(last.w)}</text>
    <text x="${x(0)}" y="${H - 6}" text-anchor="start">${short(pts[0].day)}</text>
    <text x="${x(n)}" y="${H - 6}" text-anchor="end">${short(last.day)}</text>
  </svg>`;
}

          <div class="ctl"><button type="button" data-step="w:-${step}" aria-label="نقّص الوزن">−</button>

function renderHistory() {
  const byDay = new Map();
  for (const s of db.sets) {
    const k = dayKey(s.t);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(s);
  }
  const days = [...byDay.keys()].sort().reverse();
  if (!days.length) return `<div class="stack"><h1>السجل</h1><div class="card empty"><b>السجل فاضي</b>أول ما تسجل مجموعة رح تطلع هون مرتبة حسب اليوم.</div></div>`;
  const cards = days.map(k => {
    const sets = byDay.get(k).sort((a, b) => a.t - b.t);
    const exMap = new Map();
    for (const s of sets) { if (!exMap.has(s.ex)) exMap.set(s.ex, []); exMap.get(s.ex).push(s); }
    const muscles = new Set();
    const lines = [...exMap.entries()].map(([id, ss]) => {
      const ex = exById(id);
      if (!ex) return "";
      muscles.add(ex.muscle);
      return `<div class="ex-line"><span>${esc(ex.name)}</span><span class="sets-txt num">${ss.map(x => `${fmtW(x.w)}×${x.r}`).join("  ")}</span></div>`;
    }).join("");
    const vol = Math.round(sets.reduce((a, s) => a + s.w * s.r, 0));
    return `<div class="card day stack" style="gap:10px">
      <div class="spread"><h3>${fmtDate(k)}</h3><span class="muted" style="font-size:.8rem">${daysAgo(k)}</span></div>
      <div class="chips">${[...muscles].map(m => `<span class="pill">${MUSCLES[m].name}</span>`).join("")}</div>
      <div>${lines}</div>
      <small class="muted"><span class="num">${sets.length}</span> مجموعة · حجم <span class="num">${vol.toLocaleString("en")}</span> كغ</small>
    </div>`;
  }).join("");
  return `<div class="stack"><h1>السجل</h1>${cards}</div>`;
}

    </div>
    <div class="card stack">
      <h3>نسخة احتياطية</h3>
      <small class="muted">بياناتك محفوظة على هالجهاز بس. انسخ النسخة الاحتياطية واحفظها عندك، أو انقلها لجهاز ثاني.</small>
      <div class="row"><button class="btn" type="button" id="export-copy">نسخ البيانات</button>
        <button class="btn" type="button" id="export-file">تنزيل ملف</button></div>
      <label class="label" for="import-text">استرجاع: الصق البيانات هون أو اختار ملف</label>
      <textarea class="input" id="import-text" placeholder='{"custom":[],"sets":[...]}'></textarea>
      <div class="row"><button class="btn" type="button" id="import-go">استرجاع</button>
        <input type="file" id="import-file" accept="application/json,.json"></div>
    </div>
    <div class="card stack">
      <h3>مسح كل شي</h3>
      <small class="muted">بيمسح كل الأوزان والتمارين الخاصة فيك من هالجهاز. ما في رجعة.</small>
      <button class="btn danger" type="button" data-confirm="reset">مسح كل البيانات</button>
    </div>
    <small class="muted"><span class="num">${db.sets.length}</span> مجموعة مسجلة</small>
  </div>`;
}

function render() {
  const fn = { home: renderHome, muscle: renderMuscle, exercise: renderExercise, history: renderHistory, settings: renderSettings }[ui.view];
  $view.innerHTML = fn();
  const tab = ui.view === "history" ? "history" : ui.view === "settings" ? "settings" : "home";
  document.querySelectorAll(".nav [data-go]").forEach(b => {
    if (b.dataset.go === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}

/* ---------- navigation ---------- */
function go(view, params = {}, push = true) {
  Object.assign(ui, { view }, params);
  if (push) { try { history.pushState({ view, muscle: ui.muscle, ex: ui.ex }, ""); } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => {
  const s = e.state || { view: "home" };
  Object.assign(ui, s);
  render();
});
function back() {
  if (ui.view === "exercise") go("muscle", { muscle: exById(ui.ex)?.muscle || ui.muscle });
  else go("home");
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.innerHTML = `<span>${msg}</span>${undo ? '<button type="button">تراجع</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), undo ? 5000 : 2800);
}

/* ---------- rest timer ---------- */
const T = { end: 0, id: 0, el: document.getElementById("timer") };
function fmtClock(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function tick() {
  const left = (T.end - Date.now()) / 1000;
  document.getElementById("timer-t").textContent = fmtClock(left);
  if (left <= 0) {
    clearInterval(T.id); T.id = 0;
    T.el.classList.add("done");
    document.getElementById("timer-l").textContent = "يلا المجموعة الجاية 💪";
    try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
    beep();
    setTimeout(() => { if (!T.id) T.el.hidden = true; }, 8000);
  }
}
function startTimer(sec) {
  T.end = Date.now() + sec * 1000;
  T.el.hidden = false; T.el.classList.remove("done");
  document.getElementById("timer-l").textContent = "راحة";
  clearInterval(T.id); T.id = setInterval(tick, 250); tick();
}
let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = .15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + .35);
  } catch (e) {}
}
document.getElementById("timer-minus").onclick = () => { T.end -= 15000; if (T.id) tick(); };
document.getElementById("timer-plus").onclick = () => { if (!T.id) startTimer(15); else { T.end += 15000; tick(); } };
document.getElementById("timer-stop").onclick = () => { clearInterval(T.id); T.id = 0; T.el.hidden = true; };

/* ---------- actions ---------- */
function readDraft() {
  const d = ui.drafts[ui.ex];
  const w = parseFloat(document.getElementById("w-input")?.value);
  const r = parseInt(document.getElementById("r-input")?.value, 10);
  if (!isNaN(w)) d.w = Math.max(0, w);
  if (!isNaN(r)) d.r = Math.max(1, r);
  return d;
}
function logSet() {
  const d = readDraft();
  const ex = exById(ui.ex);
  const prev = bestOf(ex.id);
  const set = { id: uid(), ex: ex.id, w: d.w, r: d.r, t: Date.now() };
  db.sets.push(set); save();
  // Unlock audio on this tap so the timer beep can play later.
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch (e) {}
  render();
  startTimer(db.rest);
  if (prev && d.w > prev.maxW) toast(`🏆 رقم قياسي جديد: ${fmtW(d.w)} كغ!`);
  else if (prev && e1rm(d.w, d.r) > prev.best1 + 0.01) toast("🔥 أفضل أداء إلك بهالتمرين (وزن × عدّات)");
}
function deleteSet(id) {
  const i = db.sets.findIndex(s => s.id === id);
  if (i < 0) return;
  const [removed] = db.sets.splice(i, 1); save(); render();
  toast("انحذفت المجموعة", () => { db.sets.push(removed); save(); render(); });
}
function exportJSON() { return JSON.stringify({ app: "gym-log", version: 1, exported: new Date().toISOString(), custom: db.custom, sets: db.sets, rest: db.rest }); }
function importJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.sets)) throw new Error();
    db.custom = Array.isArray(data.custom) ? data.custom : [];
    db.sets = data.sets.filter(s => s && s.ex && typeof s.w === "number" && typeof s.r === "number" && typeof s.t === "number");
    if (data.rest) db.rest = +data.rest;
    save(); render();
    toast(`تم الاسترجاع: ${db.sets.length} مجموعة`);
  } catch (e) { toast("البيانات مش صالحة. تأكد إنك نسخت النص كامل."); }
}
const confirmActions = {
  reset() { db = { custom: [], sets: [], rest: 90 }; save(); go("home"); toast("انمسحت كل البيانات"); },
  "delete-ex"() {
    const id = ui.ex, m = exById(id).muscle;
    db.custom = db.custom.filter(c => c.id !== id);
    db.sets = db.sets.filter(s => s.ex !== id);
    save(); go("muscle", { muscle: m });
  },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-side],[data-m],[data-muscle],[data-ex],[data-back],[data-step],[data-del],[data-confirm],#log-set,#export-copy,#export-file,#import-go");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.side) { ui.side = t.dataset.side; return render(); }
  if (t.dataset.m) return go("muscle", { muscle: t.dataset.m });
  if (t.dataset.muscle) return go("muscle", { muscle: t.dataset.muscle });
  if (t.dataset.ex) return go("exercise", { ex: t.dataset.ex });
  if (t.hasAttribute("data-back")) return back();
  if (t.dataset.step) {
    const [k, v] = t.dataset.step.split(":");
    const d = readDraft();
    d[k] = k === "w" ? Math.max(0, Math.round((d.w + +v) * 100) / 100) : Math.max(1, d.r + +v);
    document.getElementById(k === "w" ? "w-input" : "r-input").value = k === "w" ? fmtW(d.w) : d.r;
    if (k === "w") { const p = document.getElementById("plates"); if (p) p.innerHTML = platesHTML(d.w); }
    return;
  }
  if (t.dataset.del) return deleteSet(t.dataset.del);
  if (t.dataset.confirm) {
    if (!t.classList.contains("armed")) {
      t.classList.add("armed"); t.dataset.orig = t.textContent; t.textContent = "متأكد؟ اضغط مرة ثانية";
      setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = t.dataset.orig; } }, 4000);
      return;
    }
    return confirmActions[t.dataset.confirm]();
  }
  if (t.id === "log-set") return logSet();
  if (t.id === "export-copy") {
    const txt = exportJSON();
    const area = document.getElementById("import-text");
    navigator.clipboard?.writeText(txt).then(() => toast("انسخت البيانات. الصقها بمكان آمن."), () => {
      area.value = txt; area.select(); toast("حطيت البيانات بالمربع. انسخها يدوياً.");
    }) ?? (area.value = txt, area.select());
    return;
  }
  if (t.id === "export-file") {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([exportJSON()], { type: "application/json" }));
      a.download = `gym-log-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("التنزيل مش متاح هون. استعمل نسخ البيانات."); }
    return;
  }
  if (t.id === "import-go") return importJSON(document.getElementById("import-text").value);
});

document.addEventListener("input", e => {
  if (e.target.id === "w-input" || e.target.id === "r-input") {
    const d = readDraft();
    const p = document.getElementById("plates");
    if (p && e.target.id === "w-input") p.innerHTML = platesHTML(d.w);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "rest-sel") { db.rest = +e.target.value; save(); toast("انحفظت مدة الراحة"); }
  if (e.target.id === "import-file" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "add-ex-form") return;
  e.preventDefault();
  const name = document.getElementById("new-ex-name").value.trim();
  if (!name) return;
  const ex = { id: "c-" + uid(), name, type: document.getElementById("new-ex-type").value, muscle: ui.muscle };
  db.custom.push(ex); save();
  go("exercise", { ex: ex.id });
});

/* ---------- boot ---------- */
load();
try { history.replaceState({ view: "home" }, ""); } catch (e) {}
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
