<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--pwa-start-->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>دفتر الجيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: dark, single-column training app. Dashboard → body map → muscle → exercise logger; frosted tab bar.
   Committed to one dark look (gym floor, rubber + steel); colors are set explicitly, never inherited. */
:root {
  --bg: #0b0d11;
  --bg-glow: #13203a;
  --surface: #14171d;
  --surface-2: #1b1f27;
  --surface-3: #252a34;
  --line: #262b35;
  --line-soft: #1e222a;
  --fg: #f1f3f6;
  --fg-2: #c5cad3;
  --muted: #858d9b;
  --accent: #3d7bff;            /* 20 kg plate blue */
  --accent-2: #6ea0ff;
  --accent-ink: #ffffff;
  --accent-soft: rgb(61 123 255 / .14);
  --gold: #f4b740;              /* personal records */
  --fresh: #ff5a4e;             /* trained < 24h */
  --recover: #f6b23c;           /* 24–72h */
  --ready: #35c76f;             /* rested */
  --skin-a: #1d222b; --skin-b: #151920;
  --mus-a: #3a414e; --mus-b: #2b313b;
  --plate-25: #e0453a; --plate-20: #2f6fe8; --plate-15: #e8b62c; --plate-10: #2fa65a;
  --plate-5: #e9ecf0; --plate-2: #2a2e35; --plate-1: #9aa3ae;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  background-image: radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 60%);
  background-attachment: fixed;
  font: 15px/1.6 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 170px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; font-weight: 700; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.num, .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; direction: ltr; unicode-bidi: isolate; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: .72rem; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 18px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }
.section-h h2 { font-size: 1.02rem; }

@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise .32s cubic-bezier(.2,.7,.2,1) both; }
  .enter > *:nth-child(2) { animation-delay: .03s; }
  .enter > *:nth-child(3) { animation-delay: .06s; }
  .enter > *:nth-child(4) { animation-delay: .09s; }
  .enter > *:nth-child(n+5) { animation-delay: .12s; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } }
}

/* ---------- top bars ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, var(--accent), #1f4fc4); display: grid; place-items: center; box-shadow: 0 6px 18px rgb(61 123 255 / .35); }
.brand .logo svg { width: 24px; height: 24px; }
.brand small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.2; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.2; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface-2); width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:active { transform: scale(.96); }
.topbar .titles { min-width: 0; flex: 1; }
.topbar .titles h1 { font-size: 1.35rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; }
.chip.fresh { background: rgb(255 90 78 / .14); color: var(--fresh); }
.chip.recover { background: rgb(246 178 60 / .14); color: var(--recover); }
.chip.ready { background: rgb(53 199 111 / .14); color: var(--ready); }
.chip.pr { background: rgb(244 183 64 / .14); color: var(--gold); }
.chip.accent { background: var(--accent-soft); color: var(--accent-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mus-a); flex: none; display: inline-block; }
.dot.fresh { background: var(--fresh); box-shadow: 0 0 8px var(--fresh); }
.dot.recover { background: var(--recover); box-shadow: 0 0 8px var(--recover); }
.dot.ready { background: var(--ready); box-shadow: 0 0 8px var(--ready); }

/* ---------- dashboard ---------- */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 104px; height: 104px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-3); stroke-width: 9; }
.ring .bar { fill: none; stroke: url(#ringGrad); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font-family: var(--font-num); font-size: 2rem; line-height: 1; font-weight: 700; }
.ring .lbl span { font-size: .7rem; color: var(--muted); }
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kv b { display: block; font-family: var(--font-num); font-size: 1.6rem; font-weight: 700; line-height: 1.05; }
.kv span { font-size: .75rem; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .68rem; color: var(--muted); }
.wd i { width: 30px; height: 30px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; font-style: normal; font-family: var(--font-num); font-size: .9rem; color: var(--fg-2); }
.wd.on i { background: linear-gradient(145deg, var(--accent), #2557d6); color: #fff; box-shadow: 0 4px 12px rgb(61 123 255 / .35); }
.wd.today i { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.wd.future i { opacity: .45; }

.map-card { position: relative; padding: 16px 12px 14px; overflow: hidden; }
.map-card::before { content: ""; position: absolute; inset: 40px 15% auto; height: 70%; background: radial-gradient(closest-side, rgb(61 123 255 / .16), transparent); pointer-events: none; }
.map-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-inline: 6px; position: relative; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: .85rem; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }
.map-wrap { display: grid; place-items: center; position: relative; padding-block: 6px; }
.bodymap { width: 100%; max-width: 260px; height: auto; max-height: 56vh; touch-action: manipulation; overflow: visible; }
.bodymap .skin { fill: url(#skinGrad); }
.bodymap .figure { filter: drop-shadow(0 0 1px rgb(255 255 255 / .12)) drop-shadow(0 18px 24px rgb(0 0 0 / .45)); }
.bodymap .m { fill: url(#musGrad); stroke: var(--bg); stroke-width: 1; cursor: pointer; transition: fill .2s, filter .2s, opacity .2s; }
.bodymap .hit:hover .m, .bodymap .hit:focus-visible .m { fill: #4a5363; }
.bodymap .m.fresh { fill: var(--fresh); filter: drop-shadow(0 0 5px rgb(255 90 78 / .7)); }
.bodymap .m.recover { fill: var(--recover); filter: drop-shadow(0 0 5px rgb(246 178 60 / .6)); }
.bodymap .m.ready { fill: var(--ready); filter: drop-shadow(0 0 4px rgb(53 199 111 / .55)); }
.bodymap .deco { fill: none; stroke: var(--bg); stroke-width: .9; stroke-linecap: round; pointer-events: none; opacity: .9; }
.bodymap .hit { outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; position: relative; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; color: var(--fg-2); background: var(--bg); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }

.suggest-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
.suggest-row::-webkit-scrollbar { display: none; }
.sugg { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px 14px; display: flex; align-items: center; gap: 10px; text-align: start; }
.sugg b { display: block; font-weight: 600; font-size: .9rem; line-height: 1.3; }
.sugg small { color: var(--muted); font-size: .75rem; }

.groups { display: flex; flex-direction: column; gap: 18px; }
.group h3 { font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 1px solid var(--line-soft); background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; text-align: start; display: flex; flex-direction: column; gap: 4px; overflow: hidden; min-width: 0; transition: transform .12s, border-color .2s; }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile:active { transform: scale(.98); }
.tile:hover { border-color: var(--line); }
.tile b { font-weight: 600; font-size: .92rem; line-height: 1.35; }
.tile small { color: var(--muted); font-size: .74rem; display: flex; align-items: center; gap: 6px; }
.tile::after { content: ""; position: absolute; inset-block: 12px; inset-inline-start: 0; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
.tile.fresh::after { background: var(--fresh); }
.tile.recover::after { background: var(--recover); }
.tile.ready::after { background: var(--ready); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); overflow: hidden; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: transparent; text-align: start; width: 100%; border-top: 1px solid var(--line-soft); }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.item .ico { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-3); display: grid; place-items: center; flex: none; color: var(--accent-2); }
.item .ico svg { width: 22px; height: 22px; }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { display: block; font-weight: 600; }
.item .grow small { color: var(--muted); font-size: .8rem; }
.item .end { text-align: end; flex: none; }
.item .end b { display: block; font-family: var(--font-num); font-size: 1.25rem; line-height: 1.1; color: var(--fg); }
.item .end small { font-size: .7rem; color: var(--muted); }
.chev { color: var(--muted); flex: none; display: grid; }

/* ---------- buttons & inputs ---------- */
.btn { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 18px; font-weight: 600; background: var(--surface-3); color: var(--fg); }
.btn:active { transform: scale(.98); }
.btn.primary { border: 0; background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-ink); font-family: var(--font-display); font-size: 1.05rem; padding: 16px 18px; width: 100%; border-radius: var(--r-md); box-shadow: 0 10px 24px -8px rgb(61 123 255 / .6), inset 0 1px 0 rgb(255 255 255 / .25); display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.primary svg { width: 20px; height: 20px; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgb(255 90 78 / .1); border-color: rgb(255 90 78 / .25); color: var(--fresh); }
.btn.armed { background: var(--fresh); border-color: var(--fresh); color: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 11px 13px; color: var(--fg); }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 110px; direction: ltr; font-family: ui-monospace, monospace; font-size: .78rem; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- exercise logger ---------- */
.target { position: relative; overflow: hidden; background: linear-gradient(135deg, #16274a, #121a2b 60%, var(--surface)); border-color: rgb(61 123 255 / .25); }
.target::after { content: ""; position: absolute; width: 220px; height: 220px; inset-inline-end: -70px; top: -90px; border-radius: 50%; border: 26px solid rgb(61 123 255 / .08); pointer-events: none; }
.target .big { font-family: var(--font-num); font-size: 3rem; font-weight: 800; line-height: 1; letter-spacing: .01em; }
.target .big small { font-size: 1.1rem; color: var(--fg-2); font-weight: 600; margin-inline: 4px; }
.target .why { color: var(--fg-2); font-size: .85rem; }
.lastline { display: flex; flex-wrap: wrap; gap: 6px; }
.lastline span { font-family: var(--font-num); font-size: .95rem; background: rgb(255 255 255 / .06); padding: 1px 8px; border-radius: 6px; color: var(--fg-2); }

.logger-head { display: flex; align-items: center; justify-content: space-between; }
.setno { font-family: var(--font-display); font-weight: 600; display: inline-flex; align-items: baseline; gap: 6px; }
.setno .n { font-size: 1.3rem; color: var(--accent-2); }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stepper .ctl { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stepper input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--font-num); font-size: 2.6rem; font-weight: 700; line-height: 1; padding: 0; color: var(--fg); -moz-appearance: textfield; }
.stepper input:focus { outline: none; }
.stepper .ctl:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .unit { font-size: .72rem; color: var(--muted); }
.stepper .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; direction: ltr; }
.stepper .btns button { border: 0; background: var(--surface-3); border-radius: 10px; height: 38px; font-size: 1.3rem; line-height: 1; color: var(--fg); }
.stepper .btns button:active { background: var(--accent); color: #fff; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; direction: ltr; justify-content: center; }
.quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-family: var(--font-num); font-size: .95rem; color: var(--fg-2); }
.quick button:active { background: var(--surface-3); }

.plates-box { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.plates-box svg { flex: none; width: 150px; height: 64px; direction: ltr; }
.plates-box p { font-size: .8rem; color: var(--muted); line-height: 1.5; }
.plates-box p b { color: var(--fg); font-family: var(--font-num); font-size: 1rem; }

.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { font-size: .7rem; color: var(--muted); font-weight: 600; text-align: center; padding: 0 4px 8px; letter-spacing: .03em; }
.table td { text-align: center; padding: 9px 4px; border-top: 1px solid var(--line-soft); }
.table td.n { font-size: 1.2rem; font-weight: 700; }
.table td.prev { color: var(--muted); font-family: var(--font-num); font-size: 1rem; }
.table .idx { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); display: inline-grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: .95rem; }
.table tr.done .idx { background: rgb(53 199 111 / .16); color: var(--ready); }
.delta { font-size: .75rem; font-weight: 700; font-family: var(--font-num); }
.delta.up { color: var(--ready); } .delta.down { color: var(--fresh); } .delta.eq { color: var(--muted); }
.x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; }
.x:hover { background: var(--surface-3); color: var(--fresh); }
.x svg { width: 16px; height: 16px; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpis div { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 10px 12px; }
.kpis b { display: block; font-family: var(--font-num); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.kpis b.gold { color: var(--gold); }
.kpis span { font-size: .7rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 6px 4px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }
.chart { width: 100%; height: auto; display: block; direction: ltr; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .line { fill: none; stroke: var(--accent-2); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--surface); stroke: var(--accent-2); stroke-width: 2; }
.chart .end { fill: var(--accent-2); }
.chart .halo { fill: var(--accent-2); opacity: .22; }
.chart .endlbl { fill: var(--fg); font-weight: 700; font-size: 13px; }

.sess { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.sess:first-of-type { border-top: 0; }
.sess .d { font-size: .88rem; }
.sess .d small { display: block; color: var(--muted); font-size: .72rem; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; direction: ltr; }
.pills span { font-family: var(--font-num); font-size: .92rem; background: var(--surface-3); color: var(--fg-2); padding: 0 7px; border-radius: 6px; }

/* ---------- history ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .h { font-size: .68rem; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal .c { aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-num); font-size: .95rem; color: var(--fg-2); background: var(--surface-3); border: 0; padding: 0; text-decoration: none; }
.cal .c.out { background: transparent; }
.cal .c.l1 { background: rgb(61 123 255 / .35); color: #fff; }
.cal .c.l2 { background: rgb(61 123 255 / .6); color: #fff; }
.cal .c.l3 { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgb(61 123 255 / .35); }
.cal .c.today { outline: 2px solid var(--fg-2); outline-offset: 1px; }
.day-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.day-card .meta { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); }
.day-card .meta b { color: var(--fg); font-family: var(--font-num); font-size: 1rem; }
.exl { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: .9rem; }

.trend.up .num { color: var(--ready); } .trend.down .num { color: var(--fresh); }
.lastline .lbl { background: transparent !important; font-family: var(--font-body) !important; font-size: .75rem !important; color: var(--muted) !important; padding-inline: 0 4px !important; }
.recline { font-size: .8rem; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }

   - Train inside a rep range; at the same weight, add reps until every working set reaches the top of the range.
   - Raise the load only after reaching the top in 2 consecutive sessions (NSCA "2-for-2" rule), or in 1 session

function weekInfo() {
  const start = weekStart();
  const sets = db.sets.filter(s => s.t >= start);
  const trained = new Set(sets.map(s => dayKey(s.t)));
  const days = WD.map((name, i) => {
    const k = dayKey(start + i * 86400000 + 3600000 * 2); // +2h guards against DST shifts
    return { name, k, d: +k.slice(8), on: trained.has(k), today: k === todayKey(), future: k > todayKey() };
  });
  return { days, count: trained.size, sets: sets.length, vol: Math.round(sets.reduce((a, s) => a + s.w * s.r, 0)) };
}
const fmtVol = v => v >= 10000 ? (v / 1000).toFixed(1) + "k" : v.toLocaleString("en");

/* ---------- WHOOP (via the user's Cloudflare Worker, see whoop-worker/) ---------- */
const whoop = () => (db.whoop ||= {});
function whoopKey() {
  const w = whoop();
  if (!w.key) {
    const a = new Uint8Array(32); crypto.getRandomValues(a);
    w.key = [...a].map(b => b.toString(16).padStart(2, "0")).join(""); save();
  }
  return w.key;
}
const whoopBase = () => (whoop().url || "").trim().replace(/\/+$/, "");
async function syncWhoop(force) {
  const w = whoop();
  if ((!w.connected && !w.pending) || !whoopBase()) return;
  if (!force && w.fetched && Date.now() - w.fetched < 30 * 60000) return;
  try {
    let r = await fetch(`${whoopBase()}/today?key=${whoopKey()}`);
    let d;
    if (r.status === 404) { // worker still on the first version: recovery only
      const o = await (await fetch(`${whoopBase()}/recovery?key=${whoopKey()}`)).json();
      d = { connected: o.connected, missing: ["sleep", "workout", "worker"], recovery: o.connected ? o : null };
    } else d = await r.json();
    w.fetched = Date.now();
    if (d.connected === false) {
      if (w.pending) return; // still waiting for the user to finish the WHOOP consent
      w.connected = false; save(); toast("انقطع الربط مع WHOOP. اربطه من جديد من الإعدادات."); return refresh();
    }
    if (d.connected && !w.connected) { w.connected = true; w.pending = false; toast("انربط WHOOP ✅"); }
    w.missing = d.missing || [];
    const rec = d.recovery;
    w.state = rec ? rec.state : null;
    if (rec && rec.state === "SCORED" && rec.date && dayKey(Date.parse(rec.date)) === todayKey() && typeof rec.score === "number") {
      (db.recovery ||= {})[todayKey()] = Math.round(rec.score);
      w.hrv = rec.hrv; w.rhr = rec.rhr; w.day = todayKey();
    }
    // Last night's sleep counts for the day it ended on.
    if (d.sleep && d.sleep.state === "SCORED" && dayKey(Date.parse(d.sleep.end)) === todayKey()) w.sleep = { ...d.sleep, day: todayKey() };
    if (d.cycle && typeof d.cycle.strain === "number" && (!d.cycle.end || dayKey(Date.parse(d.cycle.start)) === todayKey()))
      w.strain = { value: d.cycle.strain, day: todayKey() };
    const store = (db.whoopWorkouts ||= {});
    for (const x of d.workouts || []) store[x.id] = x;
    const cutoff = Date.now() - 120 * 86400000;
    for (const [id, x] of Object.entries(store)) if (Date.parse(x.start) < cutoff) delete store[id];
    save();
    if (["home", "exercise", "settings", "history"].includes(ui.view)) refresh();
  } catch (e) { /* offline or server unreachable: keep manual entry */ }
}
const whoopToday = k => { const v = whoop()[k]; return v && v.day === todayKey() ? v : null; };
const hm = min => `${Math.floor(min / 60)}:${pad(min % 60)}`;
// The WHOOP workout that overlaps a gym session (±45 min), else that day's strength-type workout.
function whoopWorkoutFor(day, sets) {
  const ws = Object.values(db.whoopWorkouts || {}).filter(x => dayKey(Date.parse(x.start)) === day);
  if (!ws.length) return null;
  if (sets && sets.length) {
    const a = sets[0].t - 45 * 60000, b = sets[sets.length - 1].t + 45 * 60000;
    const ov = ws.filter(x => Date.parse(x.start) <= b && Date.parse(x.end) >= a);
    if (ov.length) return ov.sort((p, q) => q.strain - p.strain)[0];
  }
  return ws.find(x => /weight|strength|functional|power|lift|bodybuild/i.test(x.sport)) || null;
}
function whoopWorkoutHTML(x) {

function platesHTML(w) {
  const BAR = 20;
  if (w < BAR) return `<div class="plates-box"><p>الوزن أقل من وزن البار الأولمبي (<b>20</b> كغ).</p></div>`;
  let side = (w - BAR) / 2;
  const sizes = [[25, "--plate-25", 58, 11], [20, "--plate-20", 58, 10], [15, "--plate-15", 50, 9], [10, "--plate-10", 42, 8], [5, "--plate-5", 32, 7], [2.5, "--plate-2", 26, 6], [1.25, "--plate-1", 20, 5]];
  const out = [];
  for (const [kg, color, h, wd] of sizes) while (side >= kg - 1e-9) { side -= kg; out.push({ kg, color, h, wd }); }
  const rest = Math.round(side * 100) / 100;
  let x = 26, svg = `<rect x="0" y="29" width="150" height="6" rx="2" fill="var(--plate-1)"/><rect x="18" y="22" width="7" height="20" rx="2" fill="var(--muted)"/>`;
  for (const p of out.slice(0, 9)) {
    svg += `<rect x="${x}" y="${32 - p.h / 2}" width="${p.wd}" height="${p.h}" rx="2.5" fill="var(${p.color})" stroke="rgb(0 0 0 / .35)" stroke-width="1"/>`;
    x += p.wd + 1.5;
  }
  const label = out.length ? out.map(p => p.kg).join(" + ") : "البار فاضي";
  return `<div class="plates-box"><svg viewBox="0 0 150 64" aria-hidden="true">${svg}</svg>
    <p>على كل جهة<br><b class="num">${label}</b>${rest ? ` <span class="num">(+${rest})</span>` : ""}</p></div>`;
}

function chartSVG(points, unit) {
  if (points.length < 2) return `<p class="muted" style="font-size:.85rem">سجّل جلستين على الأقل لتشوف منحنى تطورك.</p>`;
  const W = 340, H = 170, pl = 34, pr = 18, pt = 28, pb = 24;
  const pts = points.slice(-14);
  const ws = pts.map(p => p.v);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (lo === hi) { lo -= 2.5; hi += 2.5; }
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const lab = v => v >= 10000 ? (v / 1000).toFixed(1) + "k" : fmtW(Math.round(v * 10) / 10);
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${lab(v)}</text>`).join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1)} ${H - pb} L${x(0)} ${H - pb} Z`;
  const dots = pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="3"/>`).join("");
  const n = pts.length - 1, last = pts[n];
  const short = k => `${+k.slice(8)}/${+k.slice(5, 7)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى التطور">
    ${grid}<path d="${area}" fill="url(#areaGrad)"/><path class="line" d="${line}"/>${dots}
    <circle class="halo" cx="${x(n)}" cy="${y(last.v)}" r="9"/><circle class="end" cx="${x(n)}" cy="${y(last.v)}" r="4.5"/>
    <text class="endlbl" x="${Math.min(x(n), W - 24)}" y="${y(last.v) - 13}" text-anchor="middle">${lab(last.v)}${unit}</text>
    <text x="${x(0)}" y="${H - 6}" text-anchor="start">${short(pts[0].day)}</text>
    <text x="${x(n)}" y="${H - 6}" text-anchor="end">${short(last.day)}</text>
  </svg>`;
}

function deltaHTML(s, p) {
  if (!p) return "";
  const a = e1rm(s.w, s.r), b = e1rm(p.w, p.r);
  if (Math.abs(a - b) < 0.01) return `<span class="delta eq">=</span>`;
  return a > b ? `<span class="delta up">▲</span>` : `<span class="delta down">▼</span>`;
}

function renderHistory() {
  const byDay = new Map();
  for (const s of db.sets) {
    const k = dayKey(s.t);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(s);
  }
  const now = new Date();
  const mDate = new Date(now.getFullYear(), now.getMonth() + ui.calOff, 1);
  const y = mDate.getFullYear(), mo = mDate.getMonth();
  const lead = (mDate.getDay() + 1) % 7, dim = new Date(y, mo + 1, 0).getDate();
  let cells = WD.map(n => `<div class="h">${n.slice(0, 2)}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="c out"></div>`;
  let monthDays = 0;
  for (let dd = 1; dd <= dim; dd++) {
    const k = `${y}-${pad(mo + 1)}-${pad(dd)}`;
    const n = byDay.get(k)?.length || 0;
    if (n) monthDays++;
    const lvl = !n ? "" : n < 6 ? " l1" : n < 14 ? " l2" : " l3";
    cells += n ? `<a class="c${lvl}${k === todayKey() ? " today" : ""}" href="#d${k}" data-jump="${k}">${dd}</a>` : `<div class="c${k === todayKey() ? " today" : ""}">${dd}</div>`;
  }
  const monthName = mDate.toLocaleDateString("ar-u-nu-latn", { month: "long", year: "numeric" });
  const cal = `<div class="card stack">
    <div class="cal-head">
      <button class="iconbtn" data-cal="-1" aria-label="الشهر السابق">${I.back}</button>
      <div style="text-align:center"><h2>${monthName}</h2><small class="muted"><span class="num">${monthDays}</span> يوم تمرين</small></div>
      <button class="iconbtn" data-cal="1" aria-label="الشهر الجاي" ${ui.calOff >= 0 ? "disabled style=\"opacity:.35\"" : ""}>${I.chev}</button>
    </div>
    <div class="cal">${cells}</div>
  </div>`;

  const days = [...byDay.keys()].sort().reverse();
  if (!days.length) return `<div class="stack enter"><h1>السجل</h1>${cal}<div class="card empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
    <b>السجل فاضي</b>أول ما تسجل مجموعة رح تطلع هون مرتبة حسب اليوم.</div></div>`;

  const cards = days.slice(0, 40).map(k => {
    const sets = byDay.get(k).sort((a, b) => a.t - b.t);
    const exMap = new Map();
    for (const s of sets) { if (!exMap.has(s.ex)) exMap.set(s.ex, []); exMap.get(s.ex).push(s); }
    const muscles = new Set();
    const lines = [...exMap.entries()].map(([id, ss]) => {
      const ex = exById(id);
      if (!ex) return "";
      muscles.add(ex.muscle);
      return `<div class="exl"><span>${esc(ex.name)}</span><div class="pills">${ss.map(x => `<span>${fmtW(x.w)}×${x.r}</span>`).join("")}</div></div>`;
    }).join("");
    const vol = Math.round(sets.reduce((a, s) => a + s.w * s.r, 0));
    const mins = Math.round((sets[sets.length - 1].t - sets[0].t) / 60000);
    return `<div class="card day-card stack" id="d${k}" style="gap:12px">
      <div class="head"><div><h3>${fmtDate(k)}</h3><small class="muted">${daysAgo(k)}</small></div>
        <div class="chips row" style="gap:4px;justify-content:flex-end">${[...muscles].map(m => `<span class="chip">${MUSCLES[m].name}</span>`).join("")}</div></div>
      ${whoopWorkoutHTML(whoopWorkoutFor(k, sets))}
      <div class="meta"><span><b class="num">${sets.length}</b> مجموعة</span><span><b class="num">${vol.toLocaleString("en")}</b> كغ</span>${mins > 1 ? `<span><b class="num">${mins}</b> دقيقة</span>` : ""}</div>
      <div>${lines}</div>
    </div>`;
  }).join("");
  return `<div class="stack enter"><h1>السجل</h1>${cal}${cards}</div>`;
}

function renderSettings() {
  const opts = [60, 90, 120, 150, 180, 240].map(s => `<option value="${s}"${db.rest === s ? " selected" : ""}>${Math.floor(s / 60)}:${pad(s % 60)} دقيقة</option>`).join("");
  const gopts = [2, 3, 4, 5, 6].map(g => `<option value="${g}"${db.goal === g ? " selected" : ""}>${g} أيام بالأسبوع</option>`).join("");
  return `<div class="stack enter">
    <h1>الإعدادات</h1>
    <div class="card stack">
      <div class="spread"><div><div class="eyebrow">المعدّات</div><h3>وين بتتمرن؟</h3></div>
        <div class="seg" role="group" aria-label="المعدّات">
          <button type="button" data-equip="gym" aria-pressed="${!isGM()}">جيم</button>
          <button type="button" data-equip="gm" aria-pressed="${isGM()}">Gym Monster 2</button>
        </div></div>
      <small class="muted">${isGM()
        ? "وضع Gym Monster 2: بتطلعلك بس التمارين اللي بتنعمل على الجهاز (كيبل، بار، مقابض، حبل، حزام كاحل، بنش). الوزن بيزيد بخطوات نص كيلو لحد أقصى مقاومة الجهاز (100 كغ)، وحاسبة الأقراص مخفية. سجّل الوزن الكلي اللي بتختاره بالجهاز."
        : "وضع الجيم: كل التمارين والأجهزة، وزيادات الوزن حسب أوزان الجيم (2.5 كغ للبار والأجهزة)."}</small>
    </div>
    <div class="card stack">
      <div class="field"><label class="eyebrow" for="goal-sel">هدف التمرين الأسبوعي</label><select class="input" id="goal-sel">${gopts}</select></div>
      <div class="field"><label class="eyebrow" for="rest-sel">مدة الراحة بين المجموعات</label><select class="input" id="rest-sel">${opts}</select></div>
      <small class="muted">مؤقت الراحة بيشتغل لحاله بعد كل مجموعة.</small>
    </div>
    ${whoopSettingsHTML()}
    <div class="card stack">
      <div><div class="eyebrow">بياناتك</div><h3>نسخة احتياطية</h3></div>
      <small class="muted">بياناتك محفوظة على هالجهاز بس. انسخها واحفظها عندك، أو انقلها لجهاز ثاني.</small>
      <div class="row"><button class="btn" type="button" id="export-copy">نسخ البيانات</button>
        <button class="btn" type="button" id="export-file">تنزيل ملف</button></div>
      <label class="eyebrow" for="import-text">استرجاع: الصق البيانات هون أو اختار ملف</label>
      <textarea class="input" id="import-text" placeholder='{"custom":[],"sets":[...]}'></textarea>
      <div class="row"><button class="btn" type="button" id="import-go">استرجاع</button>
        <span class="btn ghost filebtn">اختيار ملف<input type="file" id="import-file" accept="application/json,.json" aria-label="اختيار ملف نسخة احتياطية"></span></div>
    </div>
    <div class="card stack">
      <div><div class="eyebrow">منطقة خطر</div><h3>مسح كل شي</h3></div>
      <small class="muted">بيمسح كل الأوزان والتمارين الخاصة فيك من هالجهاز. ما في رجعة.</small>
      <button class="btn danger" type="button" data-confirm="reset">مسح كل البيانات</button>
    </div>
    <small class="muted" style="text-align:center"><span class="num">${db.sets.length}</span> مجموعة مسجلة · دفتر الجيم · الإصدار <span class="num">${APP_VERSION}</span></small>
  </div>`;
}

function render() {
  const fn = { home: renderHome, muscle: renderMuscle, exercise: renderExercise, history: renderHistory, settings: renderSettings }[ui.view];
  $view.innerHTML = fn();
  const tab = ui.view === "history" ? "history" : ui.view === "settings" ? "settings" : "home";
  document.querySelectorAll(".nav [data-go]").forEach(b => {
    if (b.dataset.go === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
// Re-render without the entrance animation (for in-place updates).
function refresh() { render(); $view.firstElementChild?.classList.remove("enter"); }

/* ---------- navigation ---------- */
function go(view, params = {}, push = true) {
  Object.assign(ui, { view }, params);
  if (push) { try { history.pushState({ view, muscle: ui.muscle, ex: ui.ex }, ""); } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => { Object.assign(ui, e.state || { view: "home" }); render(); });
function back() {
  if (ui.view === "exercise") go("muscle", { muscle: exById(ui.ex)?.muscle || ui.muscle });
  else go("home");
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo, gold) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (gold ? " gold" : "");
  el.setAttribute("role", "status");
  el.innerHTML = `<span>${msg}</span>${undo ? '<button type="button">تراجع</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), undo ? 5000 : 3000);
}

/* ---------- rest timer ---------- */
const T = { end: 0, total: 1, id: 0, el: document.getElementById("timer") };
const RING = 2 * Math.PI * 18;
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
function tick() {
  const left = (T.end - Date.now()) / 1000;
  document.getElementById("timer-t").textContent = fmtClock(left);
  document.getElementById("timer-ring").style.strokeDashoffset = (RING * (1 - Math.max(0, left) / T.total)).toFixed(1);
  if (left <= 0) {
    clearInterval(T.id); T.id = 0;
    T.el.classList.add("done");
    document.getElementById("timer-l").textContent = "يلا المجموعة الجاية 💪";
    try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
    beep();
    setTimeout(() => { if (!T.id) T.el.hidden = true; }, 8000);
  }
}
function startTimer(sec) {
  T.end = Date.now() + sec * 1000; T.total = sec;
  T.el.hidden = false; T.el.classList.remove("done");
  document.getElementById("timer-l").textContent = "وقت الراحة";
  clearInterval(T.id); T.id = setInterval(tick, 250); tick();
}
let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = .15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + off); o.stop(audioCtx.currentTime + off + .15);
    });
  } catch (e) {}
}
document.getElementById("timer-minus").onclick = () => { T.end -= 15000; if (T.id) tick(); };
document.getElementById("timer-plus").onclick = () => { if (!T.id) startTimer(15); else { T.end += 15000; T.total += 15; tick(); } };
document.getElementById("timer-stop").onclick = () => { clearInterval(T.id); T.id = 0; T.el.hidden = true; };

/* ---------- actions ---------- */
function readDraft() {
  const d = ui.drafts[ui.ex];
  const w = parseFloat(document.getElementById("w-input")?.value);
  const r = parseInt(document.getElementById("r-input")?.value, 10);
  if (!isNaN(w)) d.w = capW(Math.max(0, w));
  if (!isNaN(r)) d.r = Math.max(1, r);
  return d;
}
function logSet() {
  const d = readDraft();
  const ex = exById(ui.ex);
  const prev = bestOf(ex.id);
  const set = { id: uid(), ex: ex.id, w: d.w, r: d.r, t: Date.now() };
  if (d.rir) set.rir = d.rir;
  d.rir = null;
  db.sets.push(set); save();
  // Unlock audio on this tap so the timer beep can play later.
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch (e) {}
  try { navigator.vibrate?.(15); } catch (e) {}
  refresh();
  startTimer(db.rest);
  if (prev && d.w > prev.maxW) toast(`🏆 رقم قياسي جديد: <span class="num">${fmtW(d.w)}</span> كغ!`, null, true);
  else if (prev && e1rm(d.w, d.r) > prev.best1 + 0.01) toast("🔥 أفضل أداء إلك بهالتمرين (وزن × عدّات)", null, true);
}
function deleteSet(id) {
  const i = db.sets.findIndex(s => s.id === id);
  if (i < 0) return;
  const [removed] = db.sets.splice(i, 1); save(); refresh();
  toast("انحذفت المجموعة", () => { db.sets.push(removed); save(); refresh(); });
}
const exportJSON = () => JSON.stringify({ app: "gym-log", version: 1, exported: new Date().toISOString(), custom: db.custom, sets: db.sets, rest: db.rest, goal: db.goal, ranges: db.ranges, recovery: db.recovery, equip: db.equip });
function importJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.sets)) throw new Error();
    db.custom = Array.isArray(data.custom) ? data.custom : [];
    db.sets = data.sets.filter(s => s && s.ex && typeof s.w === "number" && typeof s.r === "number" && typeof s.t === "number");
    if (data.rest) db.rest = +data.rest;
    if (data.goal) db.goal = +data.goal;
    db.ranges = data.ranges && typeof data.ranges === "object" ? data.ranges : {};
    db.recovery = data.recovery && typeof data.recovery === "object" ? data.recovery : {};
    if (data.equip) db.equip = data.equip;
    save(); refresh();
    toast(`تم الاسترجاع: <span class="num">${db.sets.length}</span> مجموعة`);
  } catch (e) { toast("البيانات مش صالحة. تأكد إنك نسخت النص كامل."); }
}
const confirmActions = {
  reset() { db = DEFAULTS(); save(); go("home"); toast("انمسحت كل البيانات"); },
  "delete-ex"() {
    const id = ui.ex, m = exById(id).muscle;
    db.custom = db.custom.filter(c => c.id !== id);
    db.sets = db.sets.filter(s => s.ex !== id);
    save(); go("muscle", { muscle: m });
  },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-equip],[data-range],[data-rir],[data-go],[data-side],[data-m],[data-muscle],[data-ex],[data-back],[data-step],[data-del],[data-confirm],[data-metric],[data-cal],[data-jump],#log-set,#export-copy,#export-file,#import-go,#whoop-connect,#whoop-sync,#whoop-off");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.side) { ui.side = t.dataset.side; return refresh(); }
  if (t.dataset.m) return go("muscle", { muscle: t.dataset.m });
  if (t.dataset.muscle) return go("muscle", { muscle: t.dataset.muscle });
  if (t.dataset.ex) return go("exercise", { ex: t.dataset.ex });
  if (t.hasAttribute("data-back")) return back();
  if (t.dataset.metric) { ui.metric = t.dataset.metric; return refresh(); }
  if (t.dataset.cal) { if (t.disabled) return; ui.calOff = Math.min(0, ui.calOff + +t.dataset.cal); return refresh(); }
  if (t.dataset.jump) { e.preventDefault(); document.getElementById("d" + t.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.step) {
    const [k, v] = t.dataset.step.split(":");
    const d = readDraft();
    d[k] = k === "w" ? capW(Math.max(0, Math.round((d.w + +v) * 100) / 100)) : Math.max(1, d.r + +v);
    document.getElementById(k === "w" ? "w-input" : "r-input").value = k === "w" ? fmtW(d.w) : d.r;
    if (k === "w") { const p = document.getElementById("plates"); if (p) p.innerHTML = platesHTML(d.w); }
    return;
  }
  if (t.dataset.equip) {
    db.equip = t.dataset.equip; save(); ui.drafts = {}; refresh();
    toast(isGM() ? "تفعّل وضع Gym Monster 2" : "رجعت لوضع الجيم");
    return;
  }
  if (t.dataset.range) {
    const [lo, hi] = t.dataset.range.split("-").map(Number);
    (db.ranges ||= {})[ui.ex] = [lo, hi]; save();
    delete ui.drafts[ui.ex];
    return refresh();
  }
  if (t.dataset.rir) { const d = readDraft(); d.rir = d.rir === t.dataset.rir ? null : t.dataset.rir; return refresh(); }
  if (t.dataset.del) return deleteSet(t.dataset.del);
  if (t.dataset.confirm) {
    if (!t.classList.contains("armed")) {
      t.classList.add("armed"); t.dataset.orig = t.textContent; t.textContent = "متأكد؟ اضغط مرة ثانية";
      setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = t.dataset.orig; } }, 4000);
      return;
    }
    return confirmActions[t.dataset.confirm]();
  }
  if (t.id === "whoop-connect") {
    const u = document.getElementById("whoop-url").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\/[^\s/]+$/.test(u)) return toast("اكتب رابط السيرفر كامل، بيبلّش بـ https://");
    whoop().url = u; whoop().pending = true; save();
    location.href = `${u}/login?key=${whoopKey()}&return=${encodeURIComponent(location.origin + location.pathname)}`;
    return;
  }
  if (t.id === "whoop-sync") { toast("عم حدّث من WHOOP…"); return syncWhoop(true); }
  if (t.id === "whoop-off") {
    const w = whoop();
    fetch(`${whoopBase()}/disconnect?key=${whoopKey()}`, { method: "POST" }).catch(() => {});
    w.connected = false; ["hrv", "rhr", "day", "sleep", "strain", "missing"].forEach(k => delete w[k]); save(); refresh(); toast("انفصل WHOOP");
    return;
  }
  if (t.id === "log-set") return logSet();
  if (t.id === "export-copy") {
    const txt = exportJSON();
    const area = document.getElementById("import-text");
    const fallback = () => { area.value = txt; area.select(); toast("حطيت البيانات بالمربع. انسخها يدوياً."); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => toast("انسخت البيانات. الصقها بمكان آمن."), fallback);
    else fallback();
    return;
  }
  if (t.id === "export-file") {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([exportJSON()], { type: "application/json" }));
      a.download = `gym-log-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("التنزيل مش متاح هون. استعمل نسخ البيانات."); }
    return;
  }
  if (t.id === "import-go") return importJSON(document.getElementById("import-text").value);
});
// Remember whether the guide is expanded so logging a set does not collapse it.
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("guide") && ui.ex) ui.guideOpen[ui.ex] = e.target.open;
}, true);
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".hit")) { e.preventDefault(); go("muscle", { muscle: e.target.dataset.m }); }
});
document.addEventListener("input", e => {
  if (e.target.id === "w-input" || e.target.id === "r-input") {
    const d = readDraft();
    const p = document.getElementById("plates");
    if (p && e.target.id === "w-input") p.innerHTML = platesHTML(d.w);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "rest-sel") { db.rest = +e.target.value; save(); toast("انحفظت مدة الراحة"); }
  if (e.target.id === "goal-sel") { db.goal = +e.target.value; save(); toast("انحفظ هدفك الأسبوعي"); }
  if (e.target.id === "import-file" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "rec-form") {
    e.preventDefault();
    const raw = document.getElementById("rec-input").value.trim();
    db.recovery ||= {};
    if (raw === "") delete db.recovery[todayKey()];
    else {
      const v = Math.round(+raw);
      if (isNaN(v) || v < 0 || v > 100) return toast("اكتب رقم بين 0 و 100.");
      db.recovery[todayKey()] = v;
    }
    save(); refresh(); toast(raw === "" ? "انمسح تعافي اليوم" : "انحفظ تعافي اليوم");
    return;
  }
  if (e.target.id !== "add-ex-form") return;
  e.preventDefault();
  const name = document.getElementById("new-ex-name").value.trim();
  if (!name) return;
  const ex = { id: "c-" + uid(), name, type: document.getElementById("new-ex-type").value, muscle: ui.muscle };
  db.custom.push(ex); save();
  go("exercise", { ex: ex.id });
});

/* ---------- boot ---------- */
load();
try { history.replaceState({ view: "home" }, ""); } catch (e) {}
if (location.hash === "#whoop-ok" || location.hash === "#whoop-denied") {
  const ok = location.hash === "#whoop-ok";
  if (ok) { whoop().connected = true; whoop().pending = false; }
  save();
  try { history.replaceState({ view: "home" }, "", location.pathname); } catch (e) {}
  if (!ok) setTimeout(() => toast("ما تم الربط مع WHOOP"), 300); else setTimeout(() => toast("انربط WHOOP ✅"), 300);
}
render();
syncWhoop(true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncWhoop(false); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // A new version took over: reload once so the screen shows it (not on the very first install).
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
