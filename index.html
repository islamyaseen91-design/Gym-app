<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>دفتر الجيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: light stone ground with white cards and ink (near-black) cards for what matters most right now:
   recovery, the coach's target and the rest timer. Four tabs (today, body, progress, history) in a floating ink bar.
   Single light look by design; every color is a token below. */
:root {
  --bg: #EDEFEC;          /* stone ground */
  --surface: #FFFFFF;
  --surface-2: #F5F6F4;   /* wells inside cards */
  --surface-3: #E6E9E6;   /* chips, secondary buttons */
  --line: #D5DAD6;
  --line-soft: #E8EBE8;
  --fg: #0E1412;
  --fg-2: #3F4843;
  --muted: #5B6560;
  --ink: #0E1412;         /* hero cards, nav, timer */
  --ink-2: #1C2420;
  --ink-line: #2B3530;
  --ink-fg: #F2F4F1;
  --ink-muted: #9AA59F;
  --accent: #2346E8;      /* cobalt */
  --accent-2: #2346E8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FD;
  --gold: #B7791F;        /* personal records */
  --fresh: #D64232;       /* trained < 24h */
  --recover: #E2A21F;     /* 24–72h */
  --ready: #1F9D55;       /* rested */
  --fresh-t: #B03024; --recover-t: #8A5A00; --ready-t: #1F7A45;   /* same states as text on light grounds */
  --skin-a: #DCE0DD; --skin-b: #D3D8D4;
  --mus-a: #C2C9C4; --mus-b: #B5BDB8;
  --plate-25: #D64232; --plate-20: #2346E8; --plate-15: #E2B42C; --plate-10: #1F9D55;
  --plate-5: #F2F4F1; --plate-2: #2A2E35; --plate-1: #9AA3AE;
  --font-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-num: "Big Shoulders Display", "Arial Narrow", system-ui, sans-serif;
  --r-xl: 28px; --r-lg: 24px; --r-md: 18px; --r-sm: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.6 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Clear the phone's status bar (time, battery) when installed to the home screen. */
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) 130px; }
body[data-view="exercise"] .app, body[data-view="builder"] .app { padding-bottom: 120px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; font-weight: 700; }
h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.num, .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; direction: ltr; unicode-bidi: isolate; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: .74rem; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; }
.ink { background: var(--ink); color: var(--ink-fg); }
.ink .eyebrow, .ink .muted { color: var(--ink-muted); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; padding-inline: 4px; }
.section-h h2 { font-size: 1.05rem; }

@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise .32s cubic-bezier(.2,.7,.2,1) both; }
  .enter > *:nth-child(2) { animation-delay: .03s; }
  .enter > *:nth-child(3) { animation-delay: .06s; }
  .enter > *:nth-child(4) { animation-delay: .09s; }
  .enter > *:nth-child(n+5) { animation-delay: .12s; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } }
}

/* ---------- top bars ---------- */
.greet { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 4px; }
.greet small { display: block; font-size: .82rem; color: var(--muted); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--fg); padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:active { transform: scale(.96); }
.topbar .titles { min-width: 0; flex: 1; }
.topbar .titles h1 { font-size: 1.45rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; padding: 3px 11px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; }
.chip.fresh { background: #FBE4E1; color: var(--fresh-t); }
.chip.recover { background: #FBEFD2; color: var(--recover-t); }
.chip.ready { background: #DDF3E6; color: var(--ready-t); }
.chip.pr { background: #F7EBD6; color: #8A5A12; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.ink .chip { background: var(--ink-2); color: var(--ink-fg); }
.ink .chip.ready { background: #3FCB7A; color: var(--ink); }
.ink .chip.fresh { background: #F0594B; color: var(--ink); }
.ink .chip.recover { background: #F2BB3A; color: var(--ink); }
.ink .chip.accent { background: #3A4BC7; color: #FFFFFF; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mus-b); flex: none; display: inline-block; }
.dot.fresh { background: var(--fresh); }
.dot.recover { background: var(--recover); }
.dot.ready { background: var(--ready); }

/* ---------- today ---------- */
.hero-card { border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.hero-top { display: flex; align-items: center; gap: 18px; }
.rring { position: relative; width: 128px; height: 128px; flex: none; }
.rring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rring .track { fill: none; stroke: var(--ink-line); stroke-width: 12; }
.rring .bar { fill: none; stroke-width: 12; stroke-linecap: round; stroke: var(--ink-muted); transition: stroke-dashoffset .6s ease; }
.rring.green .bar { stroke: #3FCB7A; } .rring.yellow .bar { stroke: #F2BB3A; } .rring.red .bar { stroke: #F0594B; }
.rring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rring .lbl b { font-family: var(--font-num); font-size: 2.9rem; font-weight: 800; line-height: 1; }
.rring .lbl span { font-size: .78rem; font-weight: 600; }
.rring.green .lbl span { color: #3FCB7A; } .rring.yellow .lbl span { color: #F2BB3A; } .rring.red .lbl span { color: #F0594B; } .rring .lbl span { color: var(--ink-muted); }
.rstats { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.rstats div { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--ink-line); }
.rstats div:last-child { border-bottom: 0; padding-bottom: 0; }
.rstats span { font-size: .82rem; color: var(--ink-muted); }
.rstats b { font-family: var(--font-num); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.rstats b small { font-size: .8rem; color: var(--ink-muted); font-weight: 600; margin-inline-start: 3px; }
.hero-note { font-size: .9rem; line-height: 1.6; color: #C9D1CC; }
.wtag { font-size: .68rem; font-weight: 700; letter-spacing: .12em; background: var(--ink-fg); color: var(--ink); padding: 3px 9px; border-radius: 6px; direction: ltr; }
.rec-form { display: flex; gap: 8px; }
.rec-form input { flex: 1; min-width: 0; border: 1px solid var(--ink-line); background: var(--ink-2); color: var(--ink-fg); border-radius: var(--r-sm); padding: 10px 12px; font-family: var(--font-num); font-size: 1.2rem; }
.rec-form input::placeholder { color: var(--ink-muted); }
.rec-form button { flex: none; border: 0; border-radius: var(--r-sm); background: var(--ink-fg); color: var(--ink); font-weight: 700; padding: 0 18px; }
.hero-card .wk { background: var(--ink-2); border-color: var(--ink-line); color: #C9D1CC; }
.hero-card .wk b { color: var(--ink-fg); }
.hero-card .wk-tag { background: var(--ink-fg); color: var(--ink); }

.plan { display: flex; flex-direction: column; gap: 14px; }
.plan .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.plan .chips span { font-size: .84rem; background: var(--bg); padding: 5px 12px; border-radius: 999px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); border: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; width: 100%; text-decoration: none; }
.cta svg { width: 20px; height: 20px; }
.cta:active { transform: scale(.98); }

.weekbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 84px; }
.weekbars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.weekbars i { display: block; width: 100%; border-radius: 8px; background: var(--surface-3); min-height: 6px; }
.weekbars .on i { background: var(--ink); }
.weekbars .today i { background: var(--accent); }
.weekbars .future i { background: var(--line-soft); }
.weekbars span { font-size: .7rem; color: var(--muted); }
.weekbars .today span { color: var(--accent); font-weight: 700; }

/* ---------- body map ---------- */
.map-card { position: relative; padding: 14px 12px 16px; border-radius: var(--r-xl); }
.map-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-inline: 6px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.card .seg { background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: .85rem; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }
.map-wrap { display: grid; place-items: center; position: relative; padding-block: 6px; }
.bodymap { width: 100%; max-width: 250px; height: auto; max-height: 58vh; touch-action: manipulation; overflow: visible; }
.bodymap .skin { fill: url(#skinGrad); }
.bodymap .figure { filter: none; }
.bodymap .m { fill: url(#musGrad); stroke: var(--surface); stroke-width: 1.2; cursor: pointer; transition: fill .2s, opacity .2s; }
.bodymap .hit:hover .m, .bodymap .hit:focus-visible .m { fill: #9CA59F; }
.bodymap .m.fresh { fill: var(--fresh); }
.bodymap .m.recover { fill: var(--recover); }
.bodymap .m.ready { fill: var(--ready); }
.bodymap .deco { fill: none; stroke: var(--surface); stroke-width: .9; stroke-linecap: round; pointer-events: none; opacity: .9; }
.bodymap .hit { outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; font-size: .76rem; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { border-radius: 3px; }

.groups { display: flex; flex-direction: column; gap: 18px; }
.group h3 { font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-bottom: 8px; padding-inline: 4px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 0; background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; text-align: start; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: transform .12s; }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile:active { transform: scale(.98); }
.tile b { font-weight: 600; font-size: .95rem; line-height: 1.35; }
.tile small { color: var(--muted); font-size: .76rem; display: flex; align-items: center; gap: 6px; }
.tile.fresh small { color: var(--fresh-t); font-weight: 600; }
.tile.recover small { color: var(--recover-t); font-weight: 600; }
.tile.ready small { color: var(--ready-t); font-weight: 600; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.item { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 0; background: transparent; text-align: start; width: 100%; border-top: 1px solid var(--line-soft); color: var(--fg); }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.item .ico { width: 64px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--accent); }
.item .ico svg { width: 22px; height: 22px; }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { display: block; font-weight: 600; }
.item .grow small { color: var(--muted); font-size: .8rem; }
.item .end { text-align: end; flex: none; }
.item .end b { display: block; font-family: var(--font-num); font-size: 1.35rem; line-height: 1.1; color: var(--gold); }
.item .end small { font-size: .7rem; color: var(--muted); }
.item .bar { width: 6px; height: 38px; border-radius: 4px; flex: none; background: var(--mus-b); }
.item .bar.fresh { background: var(--fresh); } .item .bar.recover { background: var(--recover); } .item .bar.ready { background: var(--ready); }
.item .pct { font-family: var(--font-num); font-weight: 700; font-size: 1.05rem; flex: none; direction: ltr; unicode-bidi: isolate; }
.item .pct.fresh { color: var(--fresh-t); } .item .pct.recover { color: var(--recover-t); } .item .pct.ready { color: var(--ready-t); }
.chev { color: var(--muted); flex: none; display: grid; }

/* ---------- buttons & inputs ---------- */
.btn { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 18px; font-weight: 600; background: var(--surface); color: var(--fg); }
.btn:active { transform: scale(.98); }
.btn.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 1.05rem; padding: 16px 18px; width: 100%; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.primary svg { width: 20px; height: 20px; }
.btn.ghost { background: transparent; }
.btn.danger { background: #FBE4E1; border-color: #F3C3BD; color: var(--fresh-t); }
.btn.armed { background: var(--fresh); border-color: var(--fresh); color: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 11px 13px; color: var(--fg); }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 110px; direction: ltr; font-family: ui-monospace, monospace; font-size: .78rem; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- exercise logger ---------- */
.ex-hero { position: relative; margin: calc(-20px - env(safe-area-inset-top, 0px)) -16px 0; height: calc(240px + env(safe-area-inset-top, 0px)); background: var(--surface-3); overflow: hidden; }
.ex-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ex-hero .f1 { animation: frame 2.4s steps(1, end) infinite; }
.ex-hero .iconbtn { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-start: 16px; border: 0; z-index: 2; }
.ex-hero .tag { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 6px; z-index: 2; }
.ex-hero .tag span { font-size: .74rem; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--ink); color: var(--ink-fg); }
.ex-hero .tag .s1 { animation: frame 2.4s steps(1, end) infinite; }
.ex-hero .tag .s0 { animation: frame 2.4s steps(1, end) infinite reverse; }
.ex-hero .credit { position: absolute; bottom: 14px; right: 14px; font-size: .62rem; color: #FFFFFF; text-shadow: 0 1px 2px rgb(0 0 0 / .8); direction: ltr; z-index: 2; }
.ex-hero.noimg { height: 120px; display: grid; place-items: center; color: var(--muted); }
.ex-hero.noimg svg.big { width: 56px; height: 56px; }
@keyframes frame { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .ex-hero img { width: 50%; }
  .ex-hero .f0 { inset-inline-start: auto; inset-inline-end: 0; }
  .ex-hero .f1 { animation: none; opacity: 1; inset-inline-end: auto; inset-inline-start: 0; }
  .ex-hero .tag { display: none; }
}
.ex-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-inline: 4px; }
.ex-title .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ex-title .chips .chip { background: var(--surface); }
.ex-title .pr { text-align: end; flex: none; }
.ex-title .pr small { display: block; font-size: .72rem; color: var(--muted); }
.ex-title .pr b { font-family: var(--font-num); font-size: 1.9rem; font-weight: 800; color: var(--gold); line-height: 1.1; }

.target { position: relative; background: var(--ink); color: var(--ink-fg); }
.target .big { font-family: var(--font-num); font-size: 3.4rem; font-weight: 800; line-height: 1; letter-spacing: .01em; }
.target .big small { font-family: var(--font-body); font-size: 1rem; color: #C9D1CC; font-weight: 500; margin-inline: 6px; }
.target .why { color: #C9D1CC; font-size: .88rem; line-height: 1.65; }
.target h2 { color: var(--ink-fg); }
.lastline { display: flex; flex-wrap: wrap; gap: 6px; }
.lastline span { font-family: var(--font-num); font-size: 1rem; background: var(--ink-2); padding: 1px 8px; border-radius: 6px; color: #C9D1CC; }

.logger-head { display: flex; align-items: center; justify-content: space-between; }
.setno { font-family: var(--font-display); font-weight: 700; display: inline-flex; align-items: baseline; gap: 6px; }
.setno .n { font-size: 1.45rem; color: var(--accent); }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stepper .ctl { position: relative; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stepper input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--font-num); font-size: 2.8rem; font-weight: 800; line-height: 1; padding: 0; color: var(--fg); -moz-appearance: textfield; }
.stepper input:focus { outline: none; }
.stepper .ctl:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .unit { font-size: .74rem; color: var(--muted); }
.stepper .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; direction: ltr; }
.stepper .btns button { border: 0; background: var(--surface); border-radius: 12px; height: 44px; font-size: 1.4rem; line-height: 1; color: var(--fg); box-shadow: 0 0 0 1px var(--line-soft) inset; }
.stepper .btns button:active { background: var(--ink); color: var(--ink-fg); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; direction: ltr; justify-content: center; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 13px; font-family: var(--font-num); font-size: 1rem; font-weight: 700; color: var(--fg-2); }
.quick button:active { background: var(--surface-3); }

.plates-box { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.plates-box svg { flex: none; width: 150px; height: 64px; direction: ltr; }
.plates-box p { font-size: .8rem; color: var(--muted); line-height: 1.5; }
.plates-box p b { color: var(--fg); font-family: var(--font-num); font-size: 1.05rem; }

.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { font-size: .72rem; color: var(--muted); font-weight: 600; text-align: center; padding: 0 4px 8px; letter-spacing: .03em; }
.table td { text-align: center; padding: 9px 4px; border-top: 1px solid var(--line-soft); }
.table td.n { font-size: 1.3rem; font-weight: 800; }

.table .idx { width: 28px; height: 28px; border-radius: 9px; background: var(--surface-3); display: inline-grid; place-items: center; font-family: var(--font-num); font-weight: 800; font-size: 1rem; }

.delta { font-size: .8rem; font-weight: 800; font-family: var(--font-num); }

.x { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; }

.card .kpis div { background: var(--surface-2); }
.kpis b { display: block; font-family: var(--font-num); font-size: 1.7rem; font-weight: 800; line-height: 1.1; }

.tabs { display: flex; gap: 3px; background: var(--bg); border-radius: 12px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(14 20 18 / .08); }
.chart { width: 100%; height: auto; display: block; direction: ltr; overflow: visible; }

.sess { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.sess:first-of-type { border-top: 0; }
.sess .d { font-size: .88rem; }
.sess .d small { display: block; color: var(--muted); font-size: .72rem; }

/* ---------- history ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; }

.cal .c.l2 { background: #7F95F2; color: #FFFFFF; }

.lastline .lbl { background: transparent !important; font-family: var(--font-body) !important; font-size: .76rem !important; color: var(--ink-muted) !important; padding-inline: 0 4px !important; }

.recline.green::before { background: #3FCB7A; } .recline.yellow::before { background: #F2BB3A; } .recline.red::before { background: #F0594B; }
.target details { border-top: 1px solid var(--ink-line); padding-top: 10px; }

.advice ul { margin: 10px 0 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .86rem; color: #C9D1CC; line-height: 1.6; }

.how p { font-size: .85rem; color: #C9D1CC; line-height: 1.7; margin-top: 8px; }
.how .src { font-size: .76rem; color: var(--ink-muted); }
.rir { display: flex; flex-direction: column; gap: 6px; }
.rir-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rir-btns button { border: 1px solid var(--line-soft); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--fg-2); }

.wk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: .8rem; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 8px 10px; }
.wk b { font-size: 1.05rem; color: var(--fg); }
.wk-tag { font-size: .66rem; font-weight: 700; letter-spacing: .1em; background: var(--ink); color: var(--ink-fg); border-radius: 5px; padding: 1px 6px; direction: ltr; }

/* ---------- exercise photos ---------- */
.thumb { width: 64px; height: 48px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }

/* ---------- technique guide ---------- */
.guide { padding: 0; overflow: hidden; }

.guide .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line-soft); }
.guide h4 { margin: 0 0 8px; font-size: .76rem; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.guide .musc { display: flex; flex-wrap: wrap; gap: 6px; }
.guide ol { list-style: none; margin: 0; padding: 0; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.guide ol li { counter-increment: st; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: .93rem; line-height: 1.65; }

.nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }

/* ---------- today's workout ---------- */

.mini:disabled { opacity: .35; }

.gchips button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: .92rem; }

.ttypes button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--r-sm); padding: 10px 12px; text-align: start; display: flex; flex-direction: column; gap: 2px; }
.ttypes button b { font-family: var(--font-display); font-weight: 700; }
.ttypes button small { font-size: .74rem; color: var(--muted); }
.ttypes button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ink-fg); }
.ttypes button[aria-pressed="true"] small { color: var(--ink-muted); }
.bitem { gap: 10px; padding: 11px 12px; }
.bitem .thumb, .bitem .ico { width: 52px; height: 40px; }
.bnum { font-family: var(--font-num); font-weight: 800; font-size: 1.2rem; color: var(--muted); width: 18px; text-align: center; flex: none; }
.bact { display: flex; gap: 4px; flex: none; }
.picker { background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line-soft); }
.pick-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.pick { flex: none; width: 112px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 6px; text-align: start; color: var(--fg); font-size: .78rem; line-height: 1.35; }
.pick .thumb, .pick .ico { width: 100%; height: 64px; border-radius: 10px; }

.wkbar { display: flex; gap: 4px; direction: rtl; }

.rest { position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--ink-fg); display: flex; flex-direction: column; align-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }

.rest .bigring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rest .bigring .tt { fill: none; stroke: var(--ink-2); stroke-width: 14; }
.rest .bigring .tb { fill: none; stroke: #5B7BFF; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }

.rest .next { align-self: stretch; max-width: 520px; width: 100%; margin: 28px auto 0; background: var(--ink-2); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.rest .next .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.rest .next .big span { font-size: .9rem; color: #C9D1CC; }

.timer { position: fixed; inset-inline: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 9; padding-inline: 16px; }

.timer .in { max-width: 440px; margin: 0 auto; background: var(--ink); color: var(--ink-fg); border-radius: 20px; padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgb(14 20 18 / .25); }
.timer .tring { width: 44px; height: 44px; flex: none; transform: rotate(-90deg); }

.timer .tring .tt { stroke: var(--ink-2); }

.timer .t b { display: block; font-family: var(--font-num); font-size: 1.8rem; line-height: 1; font-weight: 800; }
.timer .t small { font-size: .74rem; color: var(--ink-muted); }
.timer button.c { border: 0; background: var(--ink-2); color: var(--ink-fg); border-radius: 12px; height: 44px; min-width: 44px; padding: 0 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.05rem; }
.timer.done .tb { stroke: #3FCB7A; }

.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); inset-inline: 16px; margin: 0 auto; max-width: 420px; background: var(--ink); color: var(--ink-fg); padding: 12px 14px 12px 16px; border-radius: 16px; z-index: 40; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 28px rgb(14 20 18 / .3); }

  .toast { animation: drop .25s cubic-bezier(.2,.7,.2,1); }
  @keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
}
</style>
</head>

};

const APP_VERSION = "2026.10.08-2";
const STORE_KEY = "gymlog.v1";
const DEFAULTS = () => ({ custom: [], sets: [], rest: 90, goal: 4, ranges: {}, recovery: {} });
let db = DEFAULTS();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) db = Object.assign(DEFAULTS(), JSON.parse(raw));
  } catch (e) { /* storage unavailable: run in memory */ }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function allExercises() {
  const list = [];
  for (const [m, arr] of Object.entries(PRESETS)) {
    arr.forEach(([name, type], i) => list.push({ id: `${m}-${i}`, name, type, muscle: m, custom: false }));
  }
  return list.concat(db.custom.map(c => ({ ...c, custom: true })));
}
const exById = id => allExercises().find(e => e.id === id);
// Exercises doable on a Speediance Gym Monster 2 (two adjustable cable arms, bar, handles, rope, ankle straps, bench).

const GM_IDS = new Set([
  "chest_upper-0", "chest_upper-3", "chest_upper-6", "chest_upper-7", "chest_mid-0", "chest_mid-4", "chest_mid-6", "chest_lower-2",

const weekStart = (t = Date.now()) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 1) % 7)).getTime(); };

  const map = new Map();

    map.get(k).push(s);
  }
  return [...map.entries()].map(([day, sets]) => ({ day, sets }));

  const sets = setsOf(exId);
  if (!sets.length) return null;
  let maxW = 0, best1 = 0;
  for (const s of sets) { maxW = Math.max(maxW, s.w); best1 = Math.max(best1, e1rm(s.w, s.r)); }
  return { maxW, best1 };
}

}

/* ---------- progression coach ----------
   Evidence-based double progression:
   - Train inside a rep range; at the same weight, add reps until every working set reaches the top of the range.
   - Raise the load only after reaching the top in 2 consecutive sessions (NSCA "2-for-2" rule), or in 1 session
     rated easy (3+ reps in reserve), and never on a red recovery day.
   - Load jump ≈ 2.5% upper body / 5% lower body (inside ACSM 2009's 2–10%), rounded to the equipment step.
   - Two sessions below the bottom of the range at the same weight → drop ~10% and rebuild.
   - Trend = least-squares slope of each session's best estimated 1RM (Epley), as % per week.
   - Plateau = no new e1RM best for ≥4 sessions spanning ≥21 days. Decline = last 2 sessions >5% under the prior best. */
const LOWER = new Set(["quads", "hamstrings", "glutes", "calves", "lower_back"]);
const RANGES = [[5, 8], [6, 10], [8, 12], [10, 15], [12, 20]];

  if (["abs", "obliques", "calves", "forearms"].includes(ex.muscle)) return [12, 20];

}
const rangeOf = ex => wkRange(ex) || (db.ranges && db.ranges[ex.id]) || defaultRange(ex);
const loadStep = type => isGM() ? 0.5 : type === "dumbbell" ? 2 : 2.5;
const roundTo = (x, step) => Math.max(step, Math.round(x / step) * step);
// Working sets = the sets done at the session's heaviest weight.
function workSets(sets) { const top = Math.max(...sets.map(s => s.w)); return sets.filter(s => s.w === top); }
const sessBest = sets => Math.max(...sets.map(s => e1rm(s.w, s.r)));
function recoveryToday() { const v = db.recovery && db.recovery[todayKey()]; return typeof v === "number" ? v : null; }
const recZone = v => v == null ? null : v >= 67 ? "green" : v >= 34 ? "yellow" : "red";

function trendOf(ses) {

      <input id="rec-input" type="number" inputmode="numeric" min="0" max="100" placeholder="${w.connected ? "أو اكتبها بإيدك" : "نسبة التعافي، مثلاً 72"}" value="${v ?? ""}">
      <button type="submit">${v == null ? "حفظ" : "تعديل"}</button></form>`}

}

// Today's suggestion: the most rested muscle group that has exercises for the current equipment.
function planToday() {
  const rested = Object.keys(MUSCLES).filter(m => exercisesOf(m).length)
    .map(m => ({ m, t: muscleLast(m), st: status(m) }))
    .filter(x => x.st.cls === "ready" || x.st.cls === "");
  if (!rested.length) return null;
  const byG = {};
  for (const x of rested) (byG[MUSCLES[x.m].group] ||= []).push(x);
  const groupLast = name => Math.max(0, ...Object.keys(MUSCLES).filter(m => MUSCLES[m].group === name).map(muscleLast));
  const g = Object.entries(byG).map(([name, xs]) => ({ name, xs, t: groupLast(name) })).sort((a, b) => a.t - b.t)[0];
  const exs = [];
  for (let round = 0; exs.length < 3 && round < 3; round++) {
    for (const x of g.xs) {
      const list = exercisesOf(x.m).slice().sort((a, b) => setsOf(b.id).length - setsOf(a.id).length);
      if (list[round] && !exs.includes(list[round])) exs.push(list[round]);
      if (exs.length >= 3) break;
    }
  }
  return { name: g.name, exs, since: g.t ? daysAgo(dayKey(g.t)) : null };
}

/* ---------- today's workout ----------
   Optional one-day plan: pick muscle groups and the app fills in exercises (most-used first, round-robin
   across the group's muscles). Each exercise gets N sets; logging the last one moves on to the next exercise.
   The training type sets the rep range and rest for the plan's exercises, for today only. */
const TT = {
  auto:     { name: "حسب التمرين", range: null, rest: null },
  strength: { name: "قوة", range: [5, 8], rest: 180 },
  hyper:    { name: "تضخيم", range: [8, 12], rest: 90 },
  endur:    { name: "تحمّل", range: [12, 20], rest: 60 },
};
function wk() { const w = db.workout; return w && w.day === todayKey() && w.items.length ? w : null; }
function wkRange(ex) { const w = wk(); return w && w.items.includes(ex.id) ? TT[w.type]?.range || null : null; }
const doneToday = id => db.sets.filter(s => s.ex === id && dayKey(s.t) === todayKey()).length;
const wkNext = w => w.items.find(id => doneToday(id) < w.sets);
const GROUPS = [...new Set(Object.values(MUSCLES).map(m => m.group))];
const groupMuscles = g => Object.keys(MUSCLES).filter(m => MUSCLES[m].group === g && exercisesOf(m).length);
function rankedEx(m, shuffle) {
  const list = exercisesOf(m).slice();
  if (!shuffle) return list.sort((a, b) => setsOf(b.id).length - setsOf(a.id).length);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}
function buildWorkout(groups, shuffle) {
  const per = groups.length === 1 ? 5 : groups.length === 2 ? 3 : 2;
  const items = [];
  for (const g of groups) {
    const lists = groupMuscles(g).map(m => rankedEx(m, shuffle));
    let n = 0;
    for (let round = 0; n < per && round < 8; round++)
      for (const l of lists) {
        if (n >= per) break;
        if (l[round] && !items.includes(l[round].id)) { items.push(l[round].id); n++; }
      }
  }
  return items;
}
function initBld() {
  const w = wk();
  if (w) return { groups: w.groups.slice(), type: w.type, sets: w.sets, items: w.items.slice(), pick: null };
  const p = planToday(), groups = [p ? p.name : GROUPS[0]];
  return { groups, type: "auto", sets: 3, items: buildWorkout(groups), pick: null };
}
function openBuilder() { ui.bld = initBld(); go("builder"); }
function startWorkout() {
  const b = ui.bld;
  if (!b || !b.items.length) return;
  db.workout = { day: todayKey(), groups: b.groups.slice(), type: b.type, sets: b.sets, items: b.items.slice() };
  save(); ui.drafts = {}; ui.bld = null;
  go("exercise", { ex: wkNext(db.workout) || b.items[0] });
}

function pickerHTML(m) {
  const b = ui.bld;
  const gs = b.groups.length ? b.groups : GROUPS;
  // Swapping offers the same muscle first, then the rest of its group; adding offers the chosen groups.
  const ms = m ? [...new Set([m, ...groupMuscles(MUSCLES[m].group)])] : gs.flatMap(groupMuscles);
  const html = ms.map(mm => {
    const list = exercisesOf(mm).filter(e => !b.items.includes(e.id));
    return list.length ? `<div class="eyebrow">${MUSCLES[mm].name}</div><div class="pick-list">${list.map(e =>
      `<button type="button" class="pick" data-bpick="${e.id}">${thumbHTML(e)}<span>${esc(e.name)}</span></button>`).join("")}</div>` : "";
  }).join("");
  return `<div class="picker">${html || '<small class="muted">ما في تمارين ثانية.</small>'}</div>`;
}

function progressRows() {
  const rows = [];
  for (const ex of allExercises()) {
    const ses = sessionsOf(ex.id);

    if (st) rows.push({ ex, st, pct: trendOf(ses) });
  }
  const order = { down: 0, flat: 1, up: 2 };
  return rows.sort((a, b) => order[a.st.key] - order[b.st.key] || (b.pct ?? 0) - (a.pct ?? 0));
}
function progressReportHTML(limit) {
  const rows = progressRows().slice(0, limit || 10);
  if (!rows.length) return "";
  const HINT = { down: "نازل جلستين · جرّب أسبوع تخفيف", flat: s => `ثابت من ${s.since} جلسات · غيّر نطاق العدّات`, up: "بتتطور" };

      <span class="bar ${st.cls}"></span>
      <span class="grow"><b>${esc(ex.name)}</b><small>${st.key === "flat" ? HINT.flat(st) : st.key === "down" ? HINT.down : `${MUSCLES[ex.muscle].name} · ${st.label}`}</small></span>

}

function renderProgress() {
  const since = Date.now() - 30 * 86400000;
  const recent = db.sets.filter(s => s.t >= since);
  // A record = a set heavier than anything logged before it for that exercise.
  let prs = 0;
  const maxSoFar = {};
  for (const s of db.sets.slice().sort((a, b) => a.t - b.t)) {
    if (maxSoFar[s.ex] != null && s.w > maxSoFar[s.ex] && s.t >= since) prs++;
    maxSoFar[s.ex] = Math.max(maxSoFar[s.ex] ?? 0, s.w);
  }
  const sessions = new Set(recent.map(s => dayKey(s.t))).size;
  const vol = Math.round(recent.reduce((a, s) => a + s.w * s.r, 0));
  const focus = allExercises().map(ex => ({ ex, ses: sessionsOf(ex.id) })).filter(x => x.ses.length >= 2).sort((a, b) => b.ses.length - a.ses.length)[0];
  let chartCard = "";
  if (focus) {
    const ses = focus.ses, pct = trendOf(ses);
    const pts = {
      max: ses.map(s => ({ day: s.day, v: Math.max(...s.sets.map(x => x.w)) })),
      e1rm: ses.map(s => ({ day: s.day, v: Math.round(Math.max(...s.sets.map(x => e1rm(x.w, x.r))) * 10) / 10 })),
      vol: ses.map(s => ({ day: s.day, v: Math.round(s.sets.reduce((a, x) => a + x.w * x.r, 0)) })),
    }[ui.metric];
    const lastV = pts[pts.length - 1].v;
    chartCard = `<div class="card stack" style="gap:12px">
      <div class="spread" style="align-items:flex-start">
        <div><small class="muted">${esc(focus.ex.name)} · ${{ max: "أعلى وزن", e1rm: "أقصى تكرار تقديري", vol: "الحجم" }[ui.metric]}</small>
          <div class="num" style="font-size:2.7rem;font-weight:800;line-height:1.05">${lastV >= 10000 ? (lastV / 1000).toFixed(1) + "k" : fmtW(lastV)} <span style="font-size:1rem;color:var(--muted)">kg</span></div></div>
        ${pct != null ? `<span class="chip ${pct >= 0.25 ? "ready" : pct <= -0.25 ? "fresh" : ""}"><span class="num" style="font-size:.95rem">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</span> بالأسبوع</span>` : ""}
      </div>
      <div class="tabs" role="group" aria-label="نوع الرسم">
        <button type="button" data-metric="max" aria-pressed="${ui.metric === "max"}">أعلى وزن</button>

        <button type="button" data-metric="vol" aria-pressed="${ui.metric === "vol"}">الحجم</button>
      </div>
      ${chartSVG(pts, "")}
    </div>`;
  }
  const report = progressReportHTML(12);

function platesHTML(w) {
  const BAR = 20;
  if (w < BAR) return `<div class="plates-box"><p>الوزن أقل من وزن البار الأولمبي (<b>20</b> كغ).</p></div>`;
  let side = (w - BAR) / 2;
  const sizes = [[25, "--plate-25", 58, 11], [20, "--plate-20", 58, 10], [15, "--plate-15", 50, 9], [10, "--plate-10", 42, 8], [5, "--plate-5", 32, 7], [2.5, "--plate-2", 26, 6], [1.25, "--plate-1", 20, 5]];
  const out = [];
  for (const [kg, color, h, wd] of sizes) while (side >= kg - 1e-9) { side -= kg; out.push({ kg, color, h, wd }); }
  const rest = Math.round(side * 100) / 100;
  let x = 26, svg = `<rect x="0" y="29" width="150" height="6" rx="2" fill="var(--plate-1)"/><rect x="18" y="22" width="7" height="20" rx="2" fill="var(--muted)"/>`;
  for (const p of out.slice(0, 9)) {
    svg += `<rect x="${x}" y="${32 - p.h / 2}" width="${p.wd}" height="${p.h}" rx="2.5" fill="var(${p.color})" stroke="rgb(0 0 0 / .35)" stroke-width="1"/>`;
    x += p.wd + 1.5;
  }
  const label = out.length ? out.map(p => p.kg).join(" + ") : "البار فاضي";
  return `<div class="plates-box"><svg viewBox="0 0 150 64" aria-hidden="true">${svg}</svg>
    <p>على كل جهة<br><b class="num">${label}</b>${rest ? ` <span class="num">(+${rest})</span>` : ""}</p></div>`;
}

function chartSVG(points, unit) {
  if (points.length < 2) return `<p class="muted" style="font-size:.85rem">سجّل جلستين على الأقل لتشوف منحنى تطورك.</p>`;
  const W = 340, H = 170, pl = 34, pr = 18, pt = 28, pb = 24;
  const pts = points.slice(-14);
  const ws = pts.map(p => p.v);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (lo === hi) { lo -= 2.5; hi += 2.5; }
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const lab = v => v >= 10000 ? (v / 1000).toFixed(1) + "k" : fmtW(Math.round(v * 10) / 10);
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${lab(v)}</text>`).join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1)} ${H - pb} L${x(0)} ${H - pb} Z`;
  const dots = pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="3"/>`).join("");
  const n = pts.length - 1, last = pts[n];
  const short = k => `${+k.slice(8)}/${+k.slice(5, 7)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى التطور">
    ${grid}<path d="${area}" fill="url(#areaGrad)"/><path class="line" d="${line}"/>${dots}
    <circle class="halo" cx="${x(n)}" cy="${y(last.v)}" r="9"/><circle class="end" cx="${x(n)}" cy="${y(last.v)}" r="4.5"/>
    <text class="endlbl" x="${Math.min(x(n), W - 24)}" y="${y(last.v) - 13}" text-anchor="middle">${lab(last.v)}${unit}</text>
    <text x="${x(0)}" y="${H - 6}" text-anchor="start">${short(pts[0].day)}</text>
    <text x="${x(n)}" y="${H - 6}" text-anchor="end">${short(last.day)}</text>
  </svg>`;
}

function deltaHTML(s, p) {
  if (!p) return "";
  const a = e1rm(s.w, s.r), b = e1rm(p.w, p.r);
  if (Math.abs(a - b) < 0.01) return `<span class="delta eq">=</span>`;
  return a > b ? `<span class="delta up">▲</span>` : `<span class="delta down">▼</span>`;
}

function renderExercise() {

  const lastAny = ses.length ? ses[ses.length - 1].sets.slice(-1)[0] : null;

    w: sug ? sug.w : lastAny ? lastAny.w : (ex.type === "bodyweight" ? 0 : ex.type === "barbell" && !isGM() ? 20 : 10),

function renderHistory() {
  const byDay = new Map();
  for (const s of db.sets) {
    const k = dayKey(s.t);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(s);
  }
  const now = new Date();
  const mDate = new Date(now.getFullYear(), now.getMonth() + ui.calOff, 1);
  const y = mDate.getFullYear(), mo = mDate.getMonth();
  const lead = (mDate.getDay() + 1) % 7, dim = new Date(y, mo + 1, 0).getDate();
  let cells = WD.map(n => `<div class="h">${n.slice(0, 2)}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="c out"></div>`;
  let monthDays = 0;
  for (let dd = 1; dd <= dim; dd++) {
    const k = `${y}-${pad(mo + 1)}-${pad(dd)}`;
    const n = byDay.get(k)?.length || 0;
    if (n) monthDays++;
    const lvl = !n ? "" : n < 6 ? " l1" : n < 14 ? " l2" : " l3";
    cells += n ? `<a class="c${lvl}${k === todayKey() ? " today" : ""}" href="#d${k}" data-jump="${k}">${dd}</a>` : `<div class="c${k === todayKey() ? " today" : ""}">${dd}</div>`;
  }
  const monthName = mDate.toLocaleDateString("ar-u-nu-latn", { month: "long", year: "numeric" });
  const cal = `<div class="card stack">
    <div class="cal-head">
      <button class="iconbtn" data-cal="-1" aria-label="الشهر السابق">${I.back}</button>
      <div style="text-align:center"><h2>${monthName}</h2><small class="muted"><span class="num">${monthDays}</span> يوم تمرين</small></div>
      <button class="iconbtn" data-cal="1" aria-label="الشهر الجاي" ${ui.calOff >= 0 ? "disabled style=\"opacity:.35\"" : ""}>${I.chev}</button>
    </div>
    <div class="cal">${cells}</div>
  </div>`;

  const days = [...byDay.keys()].sort().reverse();
  if (!days.length) return `<div class="stack enter"><h1>السجل</h1>${cal}<div class="card empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
    <b>السجل فاضي</b>أول ما تسجل مجموعة رح تطلع هون مرتبة حسب اليوم.</div></div>`;

  const cards = days.slice(0, 40).map(k => {
    const sets = byDay.get(k).sort((a, b) => a.t - b.t);
    const exMap = new Map();
    for (const s of sets) { if (!exMap.has(s.ex)) exMap.set(s.ex, []); exMap.get(s.ex).push(s); }
    const muscles = new Set();
    const lines = [...exMap.entries()].map(([id, ss]) => {
      const ex = exById(id);
      if (!ex) return "";
      muscles.add(ex.muscle);
      return `<div class="exl"><span>${esc(ex.name)}</span><div class="pills">${ss.map(x => `<span>${fmtW(x.w)}×${x.r}</span>`).join("")}</div></div>`;
    }).join("");
    const vol = Math.round(sets.reduce((a, s) => a + s.w * s.r, 0));
    const mins = Math.round((sets[sets.length - 1].t - sets[0].t) / 60000);
    return `<div class="card day-card stack" id="d${k}" style="gap:12px">
      <div class="head"><div><h3>${fmtDate(k)}</h3><small class="muted">${daysAgo(k)}</small></div>
        <div class="chips row" style="gap:4px;justify-content:flex-end">${[...muscles].map(m => `<span class="chip">${MUSCLES[m].name}</span>`).join("")}</div></div>
      ${whoopWorkoutHTML(whoopWorkoutFor(k, sets))}
      <div class="meta"><span><b class="num">${sets.length}</b> مجموعة</span><span><b class="num">${vol.toLocaleString("en")}</b> كغ</span>${mins > 1 ? `<span><b class="num">${mins}</b> دقيقة</span>` : ""}</div>
      <div>${lines}</div>
    </div>`;
  }).join("");
  return `<div class="stack enter"><h1>السجل</h1>${cal}${cards}</div>`;
}

function render() {
  const fn = { home: renderHome, body: renderBody, progress: renderProgress, muscle: renderMuscle, exercise: renderExercise, history: renderHistory, settings: renderSettings, builder: renderBuilder }[ui.view] || renderHome;
  $view.innerHTML = fn();
  document.body.dataset.view = ui.view;
  const tab = { home: "home", builder: "home", body: "body", muscle: "body", exercise: "body", progress: "progress", history: "history" }[ui.view] || "";
  document.querySelectorAll(".nav [data-go]").forEach(b => {
    if (b.dataset.go === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
// Re-render without the entrance animation (for in-place updates).
function refresh() { render(); $view.firstElementChild?.classList.remove("enter"); }

/* ---------- navigation ---------- */
function go(view, params = {}, push = true) {
  Object.assign(ui, { view }, params);
  if (push) { try { history.pushState({ view, muscle: ui.muscle, ex: ui.ex }, ""); } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => { Object.assign(ui, e.state || { view: "home" }); render(); });
function back() {
  if (ui.view === "exercise" && wk()?.items.includes(ui.ex)) go("home");
  else if (ui.view === "exercise") go("muscle", { muscle: exById(ui.ex)?.muscle || ui.muscle });
  else if (ui.view === "muscle") go("body");
  else go("home");
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo, gold) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (gold ? " gold" : "");
  el.setAttribute("role", "status");
  el.innerHTML = `<span>${msg}</span>${undo ? '<button type="button">تراجع</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), undo ? 5000 : 3000);
}

/* ---------- rest timer ---------- */
// Full-screen while resting; "minimize" shrinks it to a bar so the set table stays reachable.
const T = { end: 0, total: 1, id: 0, big: false, el: document.getElementById("timer"), rest: document.getElementById("rest") };
const RING = 2 * Math.PI * 18, BIG_RING = 2 * Math.PI * 118;
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const $ = id => document.getElementById(id);
function showTimer(big) {
  T.big = big;
  T.rest.hidden = !big; T.el.hidden = big;
}
function hideTimer() { clearInterval(T.id); T.id = 0; T.rest.hidden = true; T.el.hidden = true; }
function tick() {
  const left = (T.end - Date.now()) / 1000, frac = Math.max(0, left) / T.total;
  $("timer-t").textContent = $("rest-t").textContent = fmtClock(left);
  $("timer-ring").style.strokeDashoffset = (RING * (1 - frac)).toFixed(1);
  $("rest-ring").style.strokeDashoffset = (BIG_RING * (1 - frac)).toFixed(1);
  if (left <= 0) {
    clearInterval(T.id); T.id = 0;
    T.el.classList.add("done"); T.rest.classList.add("done");
    $("timer-l").textContent = "يلا المجموعة الجاية";
    $("rest-title").textContent = "يلا المجموعة الجاية";
    try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
    beep();
    setTimeout(() => { if (!T.id) hideTimer(); }, 8000);
  }
}
function startTimer(sec) {
  T.end = Date.now() + sec * 1000; T.total = sec;
  T.el.classList.remove("done"); T.rest.classList.remove("done");
  $("timer-l").textContent = "وقت الراحة";
  $("rest-title").textContent = "وقت الراحة";
  $("rest-of").innerHTML = `من <span class="num">${fmtClock(sec)}</span>`;
  const ex = ui.view === "exercise" ? exById(ui.ex) : null, d = ex && ui.drafts[ex.id];
  if (ex && d) {
    const done = sessionsOf(ex.id).find(x => x.day === todayKey())?.sets.length || 0;
    const prev = sessionsOf(ex.id).filter(x => x.day !== todayKey()).pop()?.sets[done];
    $("rest-ctx").textContent = done ? `${ex.name} · المجموعة ${done} خلصت` : `التمرين الجاي: ${ex.name}`;
    $("rest-nl").textContent = done ? "المجموعة الجاية" : `التمرين الجاي: ${ex.name}`;
    $("rest-nw").textContent = fmtW(d.w); $("rest-nr").textContent = d.r;
    $("rest-prev").innerHTML = prev ? `المرة الماضية <span class="num">${fmtW(prev.w)}×${prev.r}</span>` : "";
    $("rest-next").hidden = false;
  } else { $("rest-ctx").textContent = ""; $("rest-next").hidden = true; }
  showTimer(true);
  clearInterval(T.id); T.id = setInterval(tick, 250); tick();
}
let audioCtx;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = .15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + off); o.stop(audioCtx.currentTime + off + .15);
    });
  } catch (e) {}
}
const shift = sec => { if (!T.id) return startTimer(Math.max(15, sec)); T.end += sec * 1000; if (sec > 0) T.total += sec; tick(); };
$("timer-minus").onclick = $("rest-minus").onclick = () => shift(-15);
$("timer-plus").onclick = $("rest-plus").onclick = () => shift(15);
$("timer-stop").onclick = $("rest-skip").onclick = hideTimer;
$("rest-min").onclick = () => showTimer(false);
$("timer-open").onclick = () => showTimer(true);

/* ---------- actions ---------- */
function readDraft() {
  const d = ui.drafts[ui.ex];
  const w = parseFloat(document.getElementById("w-input")?.value);
  const r = parseInt(document.getElementById("r-input")?.value, 10);
  if (!isNaN(w)) d.w = capW(Math.max(0, w));
  if (!isNaN(r)) d.r = Math.max(1, r);
  return d;
}
function logSet() {
  const d = readDraft();
  const ex = exById(ui.ex);
  const prev = bestOf(ex.id);
  const set = { id: uid(), ex: ex.id, w: d.w, r: d.r, t: Date.now() };
  if (d.rir) set.rir = d.rir;
  d.rir = null;
  db.sets.push(set); save();
  // Unlock audio on this tap so the timer beep can play later.
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch (e) {}
  try { navigator.vibrate?.(15); } catch (e) {}
  const w = wk(), inWk = w && w.items.includes(ex.id);
  const finished = inWk && doneToday(ex.id) === w.sets;
  const nxt = finished ? wkNext(w) : null;
  if (nxt) go("exercise", { ex: nxt }); else refresh();
  if (finished && !nxt) { hideTimer(); return toast("🎉 خلصت تمرين اليوم كله. يعطيك العافية!", null, true); }
  startTimer((inWk && TT[w.type].rest) || db.rest);
  if (prev && d.w > prev.maxW) toast(`🏆 رقم قياسي جديد: <span class="num">${fmtW(d.w)}</span> كغ!`, null, true);
  else if (prev && e1rm(d.w, d.r) > prev.best1 + 0.01) toast("🔥 أفضل أداء إلك بهالتمرين (وزن × عدّات)", null, true);
}
function deleteSet(id) {
  const i = db.sets.findIndex(s => s.id === id);
  if (i < 0) return;
  const [removed] = db.sets.splice(i, 1); save(); refresh();
  toast("انحذفت المجموعة", () => { db.sets.push(removed); save(); refresh(); });
}
const exportJSON = () => JSON.stringify({ app: "gym-log", version: 1, exported: new Date().toISOString(), custom: db.custom, sets: db.sets, rest: db.rest, goal: db.goal, ranges: db.ranges, recovery: db.recovery, equip: db.equip });
function importJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.sets)) throw new Error();
    db.custom = Array.isArray(data.custom) ? data.custom : [];
    db.sets = data.sets.filter(s => s && s.ex && typeof s.w === "number" && typeof s.r === "number" && typeof s.t === "number");
    if (data.rest) db.rest = +data.rest;
    if (data.goal) db.goal = +data.goal;
    db.ranges = data.ranges && typeof data.ranges === "object" ? data.ranges : {};
    db.recovery = data.recovery && typeof data.recovery === "object" ? data.recovery : {};
    if (data.equip) db.equip = data.equip;
    save(); refresh();
    toast(`تم الاسترجاع: <span class="num">${db.sets.length}</span> مجموعة`);
  } catch (e) { toast("البيانات مش صالحة. تأكد إنك نسخت النص كامل."); }
}
const confirmActions = {
  "end-wk"() { delete db.workout; save(); refresh(); toast("انتهى برنامج اليوم"); },
  reset() { db = DEFAULTS(); save(); go("home"); toast("انمسحت كل البيانات"); },
  "delete-ex"() {
    const id = ui.ex, m = exById(id).muscle;
    db.custom = db.custom.filter(c => c.id !== id);
    db.sets = db.sets.filter(s => s.ex !== id);
    save(); go("muscle", { muscle: m });
  },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-equip],[data-range],[data-rir],[data-go],[data-side],[data-m],[data-muscle],[data-ex],[data-back],[data-step],[data-del],[data-confirm],[data-metric],[data-cal],[data-jump],[data-bopen],[data-bgroup],[data-btype],[data-bsets],[data-bswap],[data-bup],[data-brm],[data-bpick],[data-breroll],[data-bstart],#log-set,#export-copy,#export-file,#import-go,#whoop-connect,#whoop-sync,#whoop-off");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.hasAttribute("data-bopen")) return openBuilder();
  if (t.hasAttribute("data-bstart")) return startWorkout();
  const b = ui.bld;
  if (b && t.dataset.bgroup) {
    const g = t.dataset.bgroup;
    b.groups = (b.groups.includes(g) ? b.groups.filter(x => x !== g) : [...b.groups, g]).sort((x, y) => GROUPS.indexOf(x) - GROUPS.indexOf(y));
    b.items = buildWorkout(b.groups); b.pick = null;
    return refresh();
  }
  if (b && t.dataset.btype) { b.type = t.dataset.btype; return refresh(); }
  if (b && t.dataset.bsets) { b.sets = +t.dataset.bsets; return refresh(); }
  if (b && t.dataset.bswap) { const p = t.dataset.bswap === "add" ? "add" : +t.dataset.bswap; b.pick = b.pick === p ? null : p; return refresh(); }
  if (b && t.dataset.bup) { const i = +t.dataset.bup; [b.items[i - 1], b.items[i]] = [b.items[i], b.items[i - 1]]; b.pick = null; return refresh(); }
  if (b && t.dataset.brm) { b.items.splice(+t.dataset.brm, 1); b.pick = null; return refresh(); }
  if (b && t.dataset.bpick) { if (b.pick === "add") b.items.push(t.dataset.bpick); else b.items[b.pick] = t.dataset.bpick; b.pick = null; return refresh(); }
  if (b && t.hasAttribute("data-breroll")) { b.items = buildWorkout(b.groups, true); b.pick = null; return refresh(); }
  if (t.dataset.side) { ui.side = t.dataset.side; return refresh(); }
  if (t.dataset.m) return go("muscle", { muscle: t.dataset.m });
  if (t.dataset.muscle) return go("muscle", { muscle: t.dataset.muscle });
  if (t.dataset.ex) return go("exercise", { ex: t.dataset.ex });
  if (t.hasAttribute("data-back")) return back();
  if (t.dataset.metric) { ui.metric = t.dataset.metric; return refresh(); }
  if (t.dataset.cal) { if (t.disabled) return; ui.calOff = Math.min(0, ui.calOff + +t.dataset.cal); return refresh(); }
  if (t.dataset.jump) { e.preventDefault(); document.getElementById("d" + t.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.step) {
    const [k, v] = t.dataset.step.split(":");
    const d = readDraft();
    d[k] = k === "w" ? capW(Math.max(0, Math.round((d.w + +v) * 100) / 100)) : Math.max(1, d.r + +v);
    document.getElementById(k === "w" ? "w-input" : "r-input").value = k === "w" ? fmtW(d.w) : d.r;
    if (k === "w") { const p = document.getElementById("plates"); if (p) p.innerHTML = platesHTML(d.w); }
    return;
  }
  if (t.dataset.equip) {
    db.equip = t.dataset.equip; save(); ui.drafts = {}; refresh();
    toast(isGM() ? "تفعّل وضع Gym Monster 2" : "رجعت لوضع الجيم");
    return;
  }
  if (t.dataset.range) {
    const [lo, hi] = t.dataset.range.split("-").map(Number);
    (db.ranges ||= {})[ui.ex] = [lo, hi]; save();
    delete ui.drafts[ui.ex];
    return refresh();
  }
  if (t.dataset.rir) { const d = readDraft(); d.rir = d.rir === t.dataset.rir ? null : t.dataset.rir; return refresh(); }
  if (t.dataset.del) return deleteSet(t.dataset.del);
  if (t.dataset.confirm) {
    if (!t.classList.contains("armed")) {
      t.classList.add("armed"); t.dataset.orig = t.textContent; t.textContent = "متأكد؟ اضغط مرة ثانية";
      setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = t.dataset.orig; } }, 4000);
      return;
    }
    return confirmActions[t.dataset.confirm]();
  }
  if (t.id === "whoop-connect") {
    const u = document.getElementById("whoop-url").value.trim().replace(/\/+$/, "");
    if (!/^https:\/\/[^\s/]+$/.test(u)) return toast("اكتب رابط السيرفر كامل، بيبلّش بـ https://");
    whoop().url = u; whoop().pending = true; save();
    location.href = `${u}/login?key=${whoopKey()}&return=${encodeURIComponent(location.origin + location.pathname)}`;
    return;
  }
  if (t.id === "whoop-sync") { toast("عم حدّث من WHOOP…"); return syncWhoop(true); }
  if (t.id === "whoop-off") {
    const w = whoop();
    fetch(`${whoopBase()}/disconnect?key=${whoopKey()}`, { method: "POST" }).catch(() => {});
    w.connected = false; ["hrv", "rhr", "day", "sleep", "strain", "missing"].forEach(k => delete w[k]); save(); refresh(); toast("انفصل WHOOP");
    return;
  }
  if (t.id === "log-set") return logSet();
  if (t.id === "export-copy") {
    const txt = exportJSON();
    const area = document.getElementById("import-text");
    const fallback = () => { area.value = txt; area.select(); toast("حطيت البيانات بالمربع. انسخها يدوياً."); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => toast("انسخت البيانات. الصقها بمكان آمن."), fallback);
    else fallback();
    return;
  }
  if (t.id === "export-file") {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([exportJSON()], { type: "application/json" }));
      a.download = `gym-log-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast("التنزيل مش متاح هون. استعمل نسخ البيانات."); }
    return;
  }
  if (t.id === "import-go") return importJSON(document.getElementById("import-text").value);
});
// Remember whether the guide is expanded so logging a set does not collapse it.
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("guide") && ui.ex) ui.guideOpen[ui.ex] = e.target.open;
}, true);
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".hit")) { e.preventDefault(); go("muscle", { muscle: e.target.dataset.m }); }
});
document.addEventListener("input", e => {
  if (e.target.id === "w-input" || e.target.id === "r-input") {
    const d = readDraft();
    const p = document.getElementById("plates");
    if (p && e.target.id === "w-input") p.innerHTML = platesHTML(d.w);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "rest-sel") { db.rest = +e.target.value; save(); toast("انحفظت مدة الراحة"); }
  if (e.target.id === "goal-sel") { db.goal = +e.target.value; save(); toast("انحفظ هدفك الأسبوعي"); }
  if (e.target.id === "import-file" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "rec-form") {
    e.preventDefault();
    const raw = document.getElementById("rec-input").value.trim();
    db.recovery ||= {};
    if (raw === "") delete db.recovery[todayKey()];
    else {
      const v = Math.round(+raw);
      if (isNaN(v) || v < 0 || v > 100) return toast("اكتب رقم بين 0 و 100.");
      db.recovery[todayKey()] = v;
    }
    save(); refresh(); toast(raw === "" ? "انمسح تعافي اليوم" : "انحفظ تعافي اليوم");
    return;
  }
  if (e.target.id !== "add-ex-form") return;
  e.preventDefault();
  const name = document.getElementById("new-ex-name").value.trim();
  if (!name) return;
  const ex = { id: "c-" + uid(), name, type: document.getElementById("new-ex-type").value, muscle: ui.muscle };
  db.custom.push(ex); save();
  go("exercise", { ex: ex.id });
});

/* ---------- boot ---------- */
load();
try { history.replaceState({ view: "home" }, ""); } catch (e) {}
if (location.hash === "#whoop-ok" || location.hash === "#whoop-denied") {
  const ok = location.hash === "#whoop-ok";
  if (ok) { whoop().connected = true; whoop().pending = false; }
  save();
  try { history.replaceState({ view: "home" }, "", location.pathname); } catch (e) {}
  if (!ok) setTimeout(() => toast("ما تم الربط مع WHOOP"), 300); else setTimeout(() => toast("انربط WHOOP ✅"), 300);
}
render();
syncWhoop(true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncWhoop(false); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // A new version took over: reload once so the screen shows it (not on the very first install).
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
